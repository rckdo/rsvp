<!DOCTYPE html>
<!--
  Music : Lorraine & Richard
  Ceremony music candidates for the four moments the preferences doc
  asks for: guests arriving, the entrance, the signing, the exit.
  Forty-eight pieces (twelve per moment) across classical, modern
  classical, contemporary, soul, jazz and pop, each playable in place
  via the iTunes preview API (30-second official previews, no account
  needed) with a Spotify link for the full track, and shared favourite
  hearts synced through the same database as the tracker (stored under
  weddingTracker/music so the existing rules cover them). Gated behind
  the shared passcode.

  v1.0 (26/07/2026): Initial build.
  v1.1 (27/07/2026): Twelve candidates per moment including
    contemporary picks; genre tags instead of per-track blurbs; drier
    section copy; Spotify links for full versions.
  v1.2 (27/07/2026): Spotify logo icon replaces the text link; shared
    thumbs-down hides a track into a collapsed list per section
    (stored under weddingTracker/musicHidden); intro note removed.
  v1.3 (27/07/2026): Add-a-piece button per section: song, artist and
    an optional Spotify link, shared between devices via
    weddingTracker/musicCustom, with the same player, heart, hide and
    a remove option.
-->

<style>
  :root{
    --ink:#26332c;
    --forest:#2f4a3c;
    --sage:#6f8a77;
    --gold:#a3762f;
    --paper:#eef1ea;
    --card:#fbfaf5;
    --line:#dce0d6;

  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);

    font-family:'Karla',system-ui,sans-serif;

    line-height:1.6;

  .wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}

  /* Passcode splash */
  #splash{
    position:fixed;inset:0;z-index:50;
    background:var(--forest);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  #splash.hidden{display:none}
  .splash-card{
    background:var(--card);border-radius:18px;
    padding:38px 30px 34px;max-width:340px;width:100%;
    text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.28);
  }
  .splash-card h1{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;font-size:30px;color:var(--forest);
    margin:0;line-height:1.1;
  }
  .splash-card .amp{color:var(--gold);font-style:italic;font-weight:500}
  .splash-card p{font-size:14px;color:var(--sage);margin:10px 0 24px}
  .dots{display:flex;gap:12px;justify-content:center;cursor:text;position:relative}
  .dot{
    width:50px;height:58px;
    border:1.5px solid var(--line-strong);
    border-radius:10px;background:#fff;
    font-size:26px;font-weight:700;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease;
  }
  .dot.filled{border-color:var(--sage)}
  #pin{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;font-size:26px}
  .splash-err{font-size:13px;color:#a3512f;margin-top:14px;min-height:20px}
  .dots.shake{animation:shake .4s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)}
    60%{transform:translateX(-5px)}
    80%{transform:translateX(5px)}
  }

  header{
    background:var(--forest);
    color:#f2f0e6;
    margin:0 -20px 28px;
    padding:40px 24px 34px;
    text-align:center;
  }
  header .names{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    font-size:clamp(34px,7vw,50px);
    line-height:1;margin:0;letter-spacing:.5px;
  }
  header .amp{color:#c9a86a;font-style:italic;font-weight:500}
  header .meta{margin:14px auto 0;color:#cdd6c9;font-size:15px}
  header .venue{color:#eef0e6;font-weight:500}
  .quilt{
    display:flex;justify-content:center;align-items:center;gap:6px;
    padding:10px 0;background:var(--ochre);overflow:hidden;
  }
  #quilt-top{margin:-40px -24px 30px}
  #quilt-bottom{margin:30px -24px -34px}
  .quilt .qblock{flex:0 0 auto}

  h2.sec{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;font-size:28px;color:var(--forest);
    margin:34px 0 2px;line-height:1.1;
  }
  p.sec-sub{font-size:14px;color:var(--sage);margin:0 0 12px}

  .tracklist{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .track{
    display:flex;align-items:center;gap:14px;
    padding:12px 16px;
    border-top:1px solid var(--line);
  }
  .track:first-child{border-top:none}
  .play{
    flex:0 0 auto;
    width:40px;height:40px;border-radius:50%;
    border:1.5px solid var(--line-strong);
    background:#fff;color:var(--forest);
    font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .play:hover{border-color:var(--sage)}
  .track.playing .play{background:var(--forest);border-color:var(--forest);color:#f2f0e6}
  .t-info{flex:1 1 auto;min-width:0}
  .t-title{font-weight:700;color:var(--ink);font-size:15.5px;line-height:1.3}
  .t-artist{font-size:13px;color:var(--gold);line-height:1.3}
  .t-meta{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
  .tag{
    font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--sage);background:var(--paper);
    border:1px solid var(--line);border-radius:999px;padding:1.5px 9px;
  }
  .sp{color:#1db954;display:inline-flex;align-items:center;line-height:1}
  .sp:hover{color:#169c46}
  .hide{
    flex:0 0 auto;
    background:none;border:none;cursor:pointer;
    color:var(--line-strong);padding:6px 4px;line-height:1;
    transition:color .15s ease;
  }
  .hide:hover{color:var(--rust)}
  .hidden-list{margin-top:10px}
  .hidden-list summary{
    cursor:pointer;
    font-size:12.5px;font-weight:700;letter-spacing:.03em;
    color:var(--sage);padding:2px 4px;
  }
  .hidden-list .tracklist{margin-top:8px;opacity:.72}
  .hidden-list .hide{color:var(--sage)}
  .hidden-list .hide:hover{color:var(--forest)}
  .hidden-list .hide svg{transform:rotate(180deg)}
  .track.custom .tag{background:#f3ead7;border-color:#e0cfa4;color:var(--gold)}
  .rm{
    font-size:11.5px;color:var(--line-strong);
    background:none;border:none;cursor:pointer;padding:0;font-family:inherit;
  }
  .rm:hover{color:var(--rust)}
  .addwrap{margin-top:10px}
  .add-btn{
    background:none;border:1px dashed var(--line-strong);border-radius:999px;
    color:var(--sage);font-size:12.5px;font-weight:700;font-family:inherit;
    padding:7px 18px;cursor:pointer;
    transition:color .15s ease,border-color .15s ease;
  }
  .add-btn:hover{border-color:var(--sage);color:var(--forest)}
  .addform{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-top:8px;
    display:flex;flex-direction:column;gap:8px;
  }
  .addform input{
    border:1px solid var(--line-strong);border-radius:8px;
    padding:8px 10px;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fff;
  }
  .addform input:focus{outline:none;border-color:var(--sage)}
  .af-row{display:flex;gap:8px;align-items:center}
  .af-add{
    background:var(--forest);color:#f2f0e6;border:none;border-radius:999px;
    padding:8px 20px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;
  }
  .af-cancel{
    background:none;border:1px solid var(--line-strong);border-radius:999px;
    padding:8px 16px;color:var(--sage);font-size:13px;font-family:inherit;cursor:pointer;
  }
  .af-err{font-size:12px;color:#a3512f}
  .t-perf{font-size:11.5px;color:var(--line-strong);line-height:1.3}
  .track.playing .t-perf{color:var(--sage)}
  .heart{
    flex:0 0 auto;
    background:none;border:none;cursor:pointer;
    font-size:21px;line-height:1;color:var(--line-strong);
    padding:6px;
    transition:color .15s ease, transform .15s ease;
  }
  .heart:hover{color:var(--sage)}
  .heart.on{color:var(--rust)}
  .heart.on:active{transform:scale(1.2)}
  .t-fail{font-size:11.5px;color:#a3512f}
  .t-fail a{color:var(--gold)}

  footer{margin-top:44px;text-align:center;color:var(--sage);font-size:13.5px}
  .site-menu{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

    color:var(--sage);background:var(--card);
    border:1px solid var(--line-strong);border-radius:999px;padding:9px 20px;
  }
  .site-menu a:hover{border-color:var(--sage);color:var(--forest)}
  .site-menu a.here{background:var(--forest);border-color:var(--forest);color:#f2f0e6}
</style>

function slug(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

const SPOTIFY_SVG =
  '<svg viewBox="0 0 496 512" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M248 8C111.1 8 0 119.1 0 256s111.1 248 248 248 248-111.1 248-248S384.9 8 248 8zm100.7 364.9c-4.2 6.8-13.2 8.9-20 4.7-55-33.6-124.6-41.2-206.3-22.5-7.8 1.8-15.5-3.1-17.3-10.9-1.8-7.8 3.1-15.5 10.9-17.3 89.7-20.5 166.6-11.7 228.1 25.9 6.8 4.3 8.9 13.3 4.6 20.1zm26.9-65.6c-5.3 8.6-16.5 11.3-25.1 6.1-62.9-38.7-158.8-49.9-233.2-27.3-9.7 2.9-19.9-2.5-22.9-12.2-2.9-9.7 2.5-19.9 12.2-22.9 85-25.8 190.7-13.3 263 31.2 8.6 5.3 11.3 16.6 6 25.1zm2.3-62.7c-75.5-44.8-200-49-272-27.1-11.6 3.5-23.9-3-27.4-14.6-3.5-11.6 3-23.9 14.6-27.4 82.7-25.1 220.2-20.3 307.1 31.3 10.4 6.2 13.8 19.6 7.7 30-6.2 10.5-19.6 13.9-30 7.7z"/></svg>';

function trackRowHtml(spotifyExtras){
  return '<button class="play" type="button" aria-label="Play preview">&#9654;</button>' +
    '<div class="t-info">' +
      '<div class="t-title"></div>' +
      '<div class="t-artist"></div>' +
      '<div class="t-meta"><span class="tag"></span><a class="sp" target="_blank" rel="noopener" aria-label="Open in Spotify">' + SPOTIFY_SVG + '</a>' + (spotifyExtras || "") + '</div>' +
      '<div class="t-perf"></div>' +
    '</div>' +
    '<button class="heart" type="button" aria-label="Favourite">&#10084;</button>' +
    '<button class="hide" type="button" aria-label="Hide this piece">' + THUMB_SVG + '</button>';
}

/* build the lists */
const root = document.getElementById("sections");
const sectionRefs = [];
MOMENTS.forEach((m, mi)=>{
  const h = document.createElement("h2");
  h.className = "sec";
  h.textContent = m.title;
  const sub = document.createElement("p");
  sub.className = "sec-sub";
  sub.textContent = m.sub;
  const list = document.createElement("div");
  list.className = "tracklist";
  const rows = [];
  m.tracks.forEach(([title, artist, genre])=>{
    const id = slug(title);
    const row = document.createElement("div");
    row.className = "track";
    row.dataset.id = id;
    row.dataset.term = title + " " + artist;
    row.innerHTML = trackRowHtml();
    row.querySelector(".t-title").textContent = title;
    row.querySelector(".t-artist").textContent = artist;
    row.querySelector(".tag").textContent = genre;
    row.querySelector(".sp").href = "https://open.spotify.com/search/" + encodeURIComponent(title + " " + artist);
    list.appendChild(row);
    rows.push(row);
  });
  const det = document.createElement("details");
  det.className = "hidden-list";
  det.style.display = "none";
  const sum = document.createElement("summary");
  const hlist = document.createElement("div");
  hlist.className = "tracklist";
  det.appendChild(sum);
  det.appendChild(hlist);

  const addWrap = document.createElement("div");
  addWrap.className = "addwrap";
  addWrap.innerHTML =
    '<button class="add-btn" type="button">+ Add a piece</button>' +
    '<div class="addform" hidden>' +
      '<input class="af-t" placeholder="Song title">' +
      '<input class="af-a" placeholder="Artist or composer">' +
      '<input class="af-sp" placeholder="Spotify link (optional)">' +
      '<div class="af-err" hidden></div>' +

    '</div>';
  wireAddForm(addWrap, mi);

  root.appendChild(h);
  root.appendChild(sub);
  root.appendChild(list);
  root.appendChild(det);
  root.appendChild(addWrap);
  sectionRefs.push({ list, hlist, det, sum, rows, customRows: [] });
});

/* shared heart state, reapplied whenever rows are added */
let lastHearts = {};
function applyHearts(){
  document.querySelectorAll(".track").forEach(row=>{
    row.querySelector(".heart").classList.toggle("on", !!lastHearts[row.dataset.id]);
  });
}

/* shared hidden state: rows fold away into the per-section list */
let hiddenState = {};
function applyHidden(){
  sectionRefs.forEach(s=>{
    let n = 0;
    s.rows.concat(s.customRows).forEach(row=>{
      const off = !!hiddenState[row.dataset.id];
      if(off){ n++; }
      (off ? s.hlist : s.list).appendChild(row);
      row.querySelector(".hide").setAttribute("aria-label", off ? "Bring this piece back" : "Hide this piece");
    });
    s.det.style.display = n ? "" : "none";
    s.sum.textContent = "Hidden (" + n + ")";
  });
}

/* header quilt bands */
(function(){
  const CREAM = "#efe6d3";
  const ACCENTS = { R:"#a34a2c", O:"#7a7c47", Y:"#c99a3f", T:"#bf6a43", K:"#4a3f2f" };
  function hst(dir, a){
    switch(dir){
      case "tl": return "linear-gradient(to bottom right, " + a + " 0 50%, " + CREAM + " 50% 100%)";
      case "br": return "linear-gradient(to bottom right, " + CREAM + " 0 50%, " + a + " 50% 100%)";
      case "tr": return "linear-gradient(to bottom left, " + a + " 0 50%, " + CREAM + " 50% 100%)";
      case "bl": return "linear-gradient(to bottom left, " + CREAM + " 0 50%, " + a + " 50% 100%)";
    }
  }
  const SHAPES = {
    G: ["tr","tl","tr","tl"], P: ["tr","br","tl","bl"], D: ["br","bl","tr","tl"],
    N: ["A","C","A","C","A","C","A","C","A"], H: ["CONIC"],
  };
  function blockEl(sk, ck){
    const cells = SHAPES[sk], a = ACCENTS[ck];
    const el = document.createElement("div");
    el.className = "qblock";
    el.style.width = "34px"; el.style.height = "34px";
    if(cells[0] === "CONIC"){
      el.style.background = "conic-gradient(" + a + " 0 45deg, " + CREAM + " 45deg 135deg, " + a + " 135deg 225deg, " + CREAM + " 225deg 315deg, " + a + " 315deg)";
      return el;
    }
    const g = Math.sqrt(cells.length);
    el.style.display = "grid";
    el.style.gridTemplateColumns = "repeat(" + g + ",1fr)";
    el.style.gridTemplateRows = "repeat(" + g + ",1fr)";
    cells.forEach(c=>{
      const cell = document.createElement("div");
      cell.style.background = c === "A" ? a : c === "C" ? CREAM : hst(c, a);
      el.appendChild(cell);
    });
    return el;
  }
  const order = [["G","R"],["P","O"],["D","Y"],["N","T"],["H","K"]];
  function fill(el, offset){
    if(!el) return;
    for(let i = 0; i < 40; i++){
      el.appendChild(blockEl(order[(i + offset) % 5][0], order[(i + offset) % 5][1]));
    }
  }
  fill(document.getElementById("quilt-top"), 1);
  fill(document.getElementById("quilt-bottom"), 3);
})();

/* =====================================================================
   Playback: official 30s previews via the public iTunes search API,
   fetched lazily on first play, one track at a time.
   ===================================================================== */
const audio = new Audio();
let playingRow = null;

function stopPlayback(){
  audio.pause();
  if(playingRow){
    playingRow.classList.remove("playing");
    playingRow.querySelector(".play").innerHTML = "&#9654;";
    playingRow = null;
  }
}
audio.addEventListener("ended", stopPlayback);

async function findPreview(term){
  const url = "https://itunes.apple.com/search?media=music&entity=song&limit=5&term=" + encodeURIComponent(term);
  const res = await fetch(url);
  const data = await res.json();
  const hit = (data.results || []).find(r=>r.previewUrl);
  return hit ? { src: hit.previewUrl, by: hit.artistName } : null;
}

function wirePlay(btn){
  btn.addEventListener("click", async ()=>{
    const row = btn.closest(".track");
    if(row === playingRow){ stopPlayback(); return; }
    stopPlayback();
    if(!row.dataset.src){
      btn.textContent = "…";
      try{
        const hit = await findPreview(row.dataset.term);
        if(!hit) throw new Error("no preview");
        row.dataset.src = hit.src;
        row.querySelector(".t-perf").textContent = "performed by " + hit.by;
      }catch(e){
        btn.innerHTML = "&#9654;";
        const fail = document.createElement("div");
        fail.className = "t-fail";
        fail.innerHTML = 'Preview unavailable here. <a href="https://www.youtube.com/results?search_query=' +
          encodeURIComponent(row.dataset.term) + '" target="_blank" rel="noopener">Listen elsewhere</a>';
        const prev = row.querySelector(".t-fail");
        if(prev) prev.remove();
        row.querySelector(".t-info").appendChild(fail);
        return;
      }
    }
    audio.src = row.dataset.src;
    audio.play().catch(()=>{});
    row.classList.add("playing");
    btn.innerHTML = "&#10073;&#10073;";
    playingRow = row;
  });
}
document.querySelectorAll(".track .play").forEach(wirePlay);

/* =====================================================================
   Favourites: shared hearts under weddingTracker/music (covered by the
   existing database rules), synced live.
   ===================================================================== */
let db = null;
function startDb(){
  if(typeof firebase === "undefined") return;
  try{ firebase.initializeApp(FIREBASE_CONFIG); }catch(e){ return; }
  db = firebase.database();
  firebase.auth().signInAnonymously().then(()=>{
    db.ref("weddingTracker/music").on("value", snap=>{
      lastHearts = snap.val() || {};
      applyHearts();
    });
    db.ref("weddingTracker/musicHidden").on("value", snap=>{
      hiddenState = snap.val() || {};
      applyHidden();
    });
    db.ref("weddingTracker/musicCustom").on("value", snap=>{
      renderCustom(snap.val());
    });
  }).catch(()=>{});
}

function wireHeart(h){
  h.addEventListener("click", ()=>{
    if(!db) return;
    const row = h.closest(".track");
    const on = h.classList.contains("on");
    db.ref("weddingTracker/music/" + row.dataset.id).set(on ? null : true);
  });
}
function wireHide(b){
  b.addEventListener("click", ()=>{
    if(!db) return;
    const row = b.closest(".track");
    const off = !!hiddenState[row.dataset.id];
    db.ref("weddingTracker/musicHidden/" + row.dataset.id).set(off ? null : true);
  });
}
document.querySelectorAll(".track .heart").forEach(wireHeart);
document.querySelectorAll(".track .hide").forEach(wireHide);

/* =====================================================================
   Your own additions: shared under weddingTracker/musicCustom, one
   entry per piece with its moment, rendered with the same player,
   heart and hide controls plus a remove link.
   ===================================================================== */
function renderCustom(v){
  sectionRefs.forEach(s=>{
    s.customRows.forEach(r=>r.remove());
    s.customRows = [];
  });
  Object.keys(v || {}).sort().forEach(key=>{
    const c = v[key];
    const s = sectionRefs[c.m];
    if(!s || !c.t) return;
    const row = document.createElement("div");
    row.className = "track custom";
    row.dataset.id = "c-" + key;
    row.dataset.term = c.t + " " + (c.a || "");
    row.innerHTML = trackRowHtml('<button class="rm" type="button">Remove</button>');
    row.querySelector(".t-title").textContent = c.t;
    row.querySelector(".t-artist").textContent = c.a || "";
    row.querySelector(".tag").textContent = "Added";
    row.querySelector(".sp").href = c.sp || ("https://open.spotify.com/search/" + encodeURIComponent(row.dataset.term.trim()));
    wirePlay(row.querySelector(".play"));
    wireHeart(row.querySelector(".heart"));
    wireHide(row.querySelector(".hide"));
    row.querySelector(".rm").addEventListener("click", ()=>{
      if(!db) return;
      if(!confirm('Remove "' + c.t + '"?')) return;
      db.ref("weddingTracker/musicCustom/" + key).remove();
      db.ref("weddingTracker/music/c-" + key).set(null);
      db.ref("weddingTracker/musicHidden/c-" + key).set(null);
    });
    s.list.appendChild(row);
    s.customRows.push(row);
  });
  applyHidden();
  applyHearts();
}

function wireAddForm(wrap, mi){
  const btn = wrap.querySelector(".add-btn");
  const form = wrap.querySelector(".addform");
  const err = wrap.querySelector(".af-err");
  const inT = wrap.querySelector(".af-t");
  const inA = wrap.querySelector(".af-a");
  const inSp = wrap.querySelector(".af-sp");
  function close(){
    form.hidden = true; btn.hidden = false;
    inT.value = ""; inA.value = ""; inSp.value = "";
    err.hidden = true;
  }
  btn.addEventListener("click", ()=>{
    form.hidden = false; btn.hidden = true;
    inT.focus();
  });
  wrap.querySelector(".af-cancel").addEventListener("click", close);
  wrap.querySelector(".af-add").addEventListener("click", ()=>{
    const t = inT.value.trim(), a = inA.value.trim(), sp = inSp.value.trim();
    if(!t){ err.textContent = "A song title is needed."; err.hidden = false; return; }
    if(sp && !/^https:\/\/open\.spotify\.com\//.test(sp)){
      err.textContent = "Spotify links start with open.spotify.com. Use the share button in Spotify.";
      err.hidden = false; return;
    }
    if(!db){ err.textContent = "Not connected just now. Try again shortly."; err.hidden = false; return; }
    db.ref("weddingTracker/musicCustom").push({ t: t, a: a, sp: sp || null, m: mi, at: new Date().toISOString() });
    close();
  });
}

/* =====================================================================
   Gate
   ===================================================================== */
const PASSCODE = "DOGS";
const UNLOCK_KEY = "rl-tracker-unlocked";
const splash = document.getElementById("splash");
const pin = document.getElementById("pin");
const dotsEl = document.getElementById("dots");
const splashErr = document.getElementById("splash-err");

function unlock(){
  try{ sessionStorage.setItem(UNLOCK_KEY, "1"); }catch(e){}
  splash.classList.add("hidden");
  startDb();
}
function paintDots(){
  const v = pin.value;
  dotsEl.querySelectorAll(".dot").forEach((d,i)=>{
    d.textContent = v[i] ? v[i].toUpperCase() : "";
    d.classList.toggle("filled", !!v[i]);
  });
}
pin.addEventListener("input", ()=>{
  pin.value = pin.value.replace(/[^a-zA-Z0-9]/g,"").slice(0,4);
  paintDots();
  if(pin.value.length === 4){
    if(pin.value.toUpperCase() === PASSCODE.toUpperCase()){ unlock(); }
    else{
      splashErr.textContent = "That's not it. Try again.";
      dotsEl.classList.add("shake");
      setTimeout(()=>{ dotsEl.classList.remove("shake"); pin.value=""; paintDots(); }, 420);
    }
  } else {
    splashErr.textContent = "";
  }
});
dotsEl.addEventListener("click", ()=>pin.focus());

let unlocked = false;
try{ unlocked = sessionStorage.getItem(UNLOCK_KEY) === "1"; }catch(e){}
if(unlocked){
  splash.classList.add("hidden");
  startDb();
} else {
  pin.focus();
}
</script>
