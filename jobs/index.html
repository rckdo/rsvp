<!DOCTYPE html>
<!--
  Jobs : a private job-search home base
  Single-file HTML. Inline CSS + JS. No build step. Data lives in Firebase Realtime Database
  under /jobs (separate from the wedding tracker).

  Changelog
  v1.7 (20/11/2026): Stickers. Any job page can have stickers dropped on it, dragged anywhere,
          resized or removed. Artwork is Twemoji (CC BY 4.0) plus two greyhounds drawn for this
          page. Today's date is back in the header as a calendar leaf, in the highlight colour.
  v1.6 (20/11/2026): Today's date removed from under the title.
  v1.5 (20/11/2026): Flourishes. Dates drawn as small calendar leaves (This week and the Next
          date column), with today's leaf picked out. Seven-day strip at the top of This week
          with a dot per thing due. Progress bar of steps under each status in Saved jobs.
          A short confetti burst when a job reaches the last status.
  v1.4 (20/11/2026): "Lock" is now "Sign out". Salary example removed. Closing date is its own
          field and feeds This week and the Next date column. Working pattern (On site / Hybrid /
          Remote) with hybrid details. Dates are editable rows with an Add date button. Laptop
          layout is a fixed split view: each half keeps its size and scrolls by itself. Short
          cross-fade between views and soft hover transitions. Spare Back button removed from
          Evidence, Notebook and Settings.
  v1.3 (20/11/2026): Notebook items are now "notes" and can be formatted: bold, italic, heading,
          bullet and numbered lists. Stored as a cleaned subset of HTML; older plain-text notes
          keep their line breaks. Pasting into a note brings plain text only.
  v1.2 (20/11/2026): Help button beside every page title opens a one-line explanation of the
          page (This week, Saved jobs, Evidence, Notebook, Settings). Research help uses the
          same icon.
  v1.1 (20/11/2026): Restyle following the Impeccable guidance. Pipeline replaced by "Saved jobs":
          one table with status filters and sortable columns; Past is a quiet filter at the end.
          Proper tab bar (fixed to the bottom on a phone). Pills removed: squared controls, status
          is a plain dropdown on the job page. Panels dropped in favour of spacing and rules.
          Line-icon set whose stroke weight follows the look. One noun throughout: "job".
  v1.0 (20/11/2026): Initial build. This Week (only dates she sets) and Pipeline home screen;
          role pages with details, dates, advert, research, notes and to-do list; one-tap
          status changes; Close this role (Not for me / Unsuccessful / Remove) with a buried,
          uncounted Past roles toggle; Notebook; Settings (look, statuses, AI switch, backup,
          recently removed, lock device); search; "Prepare this role" copy-a-prompt round trip
          for ChatGPT with reply filing. Evidence page: her own examples in Situation / Task /
          Action / Result form, with a Rehearse mode that hides the answer until she has said it. Three looks: Allotment, Lido, Blossom. Passcode is
          checked by the database rules, not stored in this page.

  HOW ACCESS WORKS
  The passcode is NOT in this file. The database holds a list at jobs/access, one entry per
  passcode. The page can look up one passcode at a time but can never list them. When a
  passcode matches, this device is recorded at jobs/grants and the rules then open jobs/data
  to it. Change or delete the entry in the Firebase console and every device is locked out
  until the new passcode is typed.

  SETUP (one-off): see game/firebase-rules.json for the rules (jobs block), then in the
  Firebase console create jobs/access/<passcode>/name = "<her name>". The passcode key must
  be lower-case letters and digits only, no spaces (she can type it with spaces, capitals or
  hyphens; they are stripped before the lookup).

  Add ?demo to the address to try it with example roles and no database.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jobs</title>
<link rel="manifest" href="/jobs/app.webmanifest">
<meta name="theme-color" content="#1F5F3F">
<link rel="icon" type="image/png" sizes="192x192" href="/jobs/icon-192.png">
<link rel="apple-touch-icon" href="/jobs/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;700&family=Karla:wght@400;500;700&family=Nunito:wght@400;600;800&family=Young+Serif&display=swap">
<style>
/* Each look is a complete palette plus lettering, corner shape and icon stroke. Components only
   use tokens. Spacing follows a 4px scale (4 8 12 16 24 32). Grouping is by spacing and rules,
   not boxes: the page is one surface, and only fields and the day chip are filled. */
:root{
  --bg:#E4EBDD; --surface:#F5F8F0; --ink:#1E2E22; --muted:#55675A; --line:#C3CFBB;
  --accent:#1F5F3F; --on-accent:#F5F8F0; --hi:#F2B632; --on-hi:#2B2206;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree","Segoe UI",sans-serif;
  --display-weight:700; --radius:10px; --stroke:1.75; --rule:1px solid var(--line);
  --ctl:calc(var(--radius) * .6);
  color-scheme:light;
}
:root[data-look="lido"]{
  --bg:#FFFFFF; --surface:#EAF2FF; --ink:#0A2A5E; --muted:#44597F; --line:#B4CCF2;
  --accent:#1456D9; --on-accent:#FFFFFF; --hi:#FF9A85; --on-hi:#3A0E05;
  --display:"Baloo 2","Trebuchet MS",sans-serif; --body:"Nunito","Segoe UI",sans-serif;
  --display-weight:700; --radius:14px; --stroke:2.25;
}
:root[data-look="blossom"]{
  --bg:#F6E4E6; --surface:#FFF7F7; --ink:#3A1730; --muted:#76536A; --line:#E3C3CB;
  --accent:#8A2A5B; --on-accent:#FFFFFF; --hi:#F9D3AE; --on-hi:#3A1730;
  --display:"Young Serif","Georgia",serif; --body:"Karla","Segoe UI",sans-serif;
  --display-weight:400; --radius:6px; --stroke:1.4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:var(--display-weight);line-height:1.15;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
body,button,input,select,textarea,.jobs tbody tr{transition:background-color .15s ease-out,color .15s ease-out,border-color .15s ease-out}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s;animation-timing-function:ease-out}
@media (prefers-reduced-motion:reduce){body,button,input,select,textarea,.jobs tbody tr{transition:none}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:var(--stroke);stroke-linecap:round;stroke-linejoin:round}

/* controls: squared, one radius, three kinds (primary, secondary, icon-only) */
.add{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--ctl);padding:10px 16px;font-weight:700;min-height:44px}
.add:hover{filter:brightness(1.1)}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:var(--rule);border-radius:var(--ctl);padding:8px 14px;font-size:.92rem;min-height:40px;text-decoration:none}
a.ghost{color:var(--ink)}
.ghost:hover:not(:disabled){background:var(--bg)}
.ghost[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.icb{display:inline-flex;background:none;border:0;padding:10px;border-radius:var(--ctl);color:var(--muted)}
.icb:hover{background:var(--bg);color:var(--ink)}
.lnk{background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:.9rem}
.x{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=url],input[type=date],input[type=time],input[type=password],textarea,select{
  width:100%;background:var(--bg);border:1px solid transparent;border-bottom-color:var(--line);border-radius:var(--ctl);padding:9px 10px;min-width:0;min-height:40px}
input:hover,textarea:hover,select:hover{border-color:var(--line)}
textarea{resize:vertical;line-height:1.5;min-height:2.8em}

/* gate */
#gate{min-height:70vh;display:grid;place-items:center}
#gate form{width:min(100%,340px);display:flex;flex-direction:column;gap:12px}
#gate h1{font-size:2rem}
#gate p{color:var(--muted);font-size:.95rem}
#gate p:empty{display:none}

/* header and tabs */
#app{display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.7rem}
.search{flex:1 1 180px;max-width:340px}
.tabs{display:flex;gap:4px;border-bottom:var(--rule)}
.tab{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 14px;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
@media (max-width:699px){
  /* on a phone the tabs become a fixed bottom bar, like an installed app */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:var(--rule);border-bottom:0;gap:0;
    padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .tab{flex:1;flex-direction:column;gap:2px;font-size:.75rem;padding:8px 2px 6px;border-bottom:0;border-top:3px solid transparent;margin:0;min-width:0}
  .tab[aria-current="page"]{border-top-color:var(--accent)}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
#banner{background:var(--hi);color:var(--on-hi);border-radius:var(--ctl);padding:8px 12px;font-size:.9rem}

/* layout: one pane at a time on a phone, list and detail side by side on a laptop */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;align-items:start}
#home,#pane{min-width:0}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>h2{font-size:1.3rem}
.head{display:flex;align-items:center;gap:4px}
.tipbox{background:var(--bg);border-radius:var(--ctl);padding:10px 12px;font-size:.92rem;max-width:60ch}
@media (max-width:979px){
  body[data-view="home"] #pane{display:none}
  body:not([data-view="home"]) #home{display:none}
}
@media (min-width:980px){
  /* fixed split view: the two halves keep their size and each scrolls by itself */
  .wrap{height:100dvh;display:flex;flex-direction:column;padding-bottom:0}
  #app{flex:1;min-height:0}
  .shell{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0;align-items:stretch}
  #home,#pane{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  #home{padding:4px 32px 48px 4px}
  #pane{border-left:var(--rule);padding:4px 4px 48px 32px}
  .back{display:none}
}
.hint{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:8px 0}

/* this week */
.week{list-style:none;padding:0}
.week li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:var(--rule)}
.day{width:60px;flex:none;border:var(--rule);border-radius:var(--ctl);overflow:hidden;text-align:center;background:var(--bg);line-height:1.2;font-variant-numeric:tabular-nums}
.day i{display:block;font-style:normal;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.day b{display:block;font-family:var(--display);font-size:1.3rem;font-weight:var(--display-weight);color:var(--ink);padding-top:3px}
.day span{display:block;font-size:.75rem;color:var(--muted);padding-bottom:4px}
.day.today i{background:var(--hi);color:var(--on-hi)}
.day.sm{width:48px}
.day.sm b{font-size:1.05rem;padding-top:2px}
.nd{display:flex;gap:8px;align-items:center;white-space:normal}
.nd>span{min-width:0}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sd{text-align:center;padding:6px 0 4px;border-radius:var(--ctl);line-height:1.25}
.sd span{display:block;font-size:.75rem;color:var(--muted)}
.sd b{display:block;font-family:var(--display);font-weight:var(--display-weight);font-size:1.05rem}
.sd em{display:flex;gap:3px;justify-content:center;height:6px;margin-top:3px}
.sd em i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sd.now{background:var(--ink)}
.sd.now span,.sd.now b{color:var(--surface)}
.sd.now em i{background:var(--hi)}
.prog{display:flex;gap:3px;margin-top:6px}
.prog i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}
.week strong{display:block}
.when{display:block;color:var(--muted);font-size:.8rem;font-weight:700;margin-top:2px}

/* saved jobs table */
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filt{background:none;border:0;border-radius:var(--ctl);padding:6px 10px;color:var(--muted);font-size:.9rem;min-height:36px}
.filt em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.75;margin-left:6px}
.filt:hover{background:var(--bg)}
.filt[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
table.jobs{width:100%;border-collapse:collapse;font-size:.95rem}
.jobs th{text-align:left;padding:8px;border-bottom:2px solid var(--ink);white-space:nowrap}
.jobs th button{background:none;border:0;padding:0;font-size:.82rem;font-weight:500;color:var(--muted)}
.jobs th button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.jobs td{padding:10px 8px;border-bottom:var(--rule);vertical-align:top}
.jobs tbody tr{cursor:pointer}
.jobs tbody tr:hover,.jobs tr.sel{background:var(--bg)}
.jobs .n{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.rowmain{width:100%;min-width:0;background:none;border:0;text-align:left;padding:0;display:block}
.rowmain strong,.rowmain span{display:block;overflow-wrap:anywhere}
.rowmain span{color:var(--muted);font-size:.9rem}
.role{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:var(--rule)}

/* job page, evidence, notebook, settings */
.back{align-self:flex-start}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{color:var(--muted);font-size:.82rem}
.big input{font-family:var(--display);font-weight:var(--display-weight);font-size:1.2rem}
.sec{margin-top:12px;padding-top:16px;border-top:var(--rule);display:flex;flex-direction:column;gap:12px}
.sec>h3{font-size:1.05rem}
.closed{background:var(--bg);border-radius:var(--ctl);padding:8px 12px;font-size:.92rem;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.list{list-style:none;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:4px 0;border-bottom:var(--rule)}
.list input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.list label{flex:1;min-width:0;overflow-wrap:anywhere;padding:6px 0}
.list label span{display:block;color:var(--muted);font-size:.85rem}
.list input:checked+label{color:var(--muted);text-decoration:line-through}
.list input:checked+.drow{opacity:.55}
.drow{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px;padding:4px 0}
.drow input[type=text]{grid-column:1 / -1}
@media (min-width:520px){.drow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr)}.drow input[type=text]{grid-column:auto}}
.inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.inline.d3{grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.inline.d3{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr) auto}}
.titlebar{display:flex;align-items:center;gap:12px}
/* today's leaf in the header is filled with the highlight colour so it reads apart from list dates */
.titlebar .day{background:var(--hi);border-color:transparent}
.titlebar .day i{background:var(--ink);color:var(--surface)}
.titlebar .day b,.titlebar .day span{color:var(--on-hi)}
.jobpanel{position:relative}
.stk{position:absolute;z-index:5;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))}
.stk svg{display:block;width:100%;height:auto;pointer-events:none}
.stk.on{outline:2px dashed var(--accent);outline-offset:6px;border-radius:4px}
.stkbar{position:absolute;z-index:6;display:flex;background:var(--surface);border:var(--rule);border-radius:var(--ctl)}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:4px}
.tray button{background:none;border:0;border-radius:var(--ctl);padding:8px}
.tray button:hover{background:var(--bg)}
.tray svg{display:block;width:100%;height:auto}
.fmtbar{display:flex;gap:2px}
.fmtbar .icb{min-width:40px;justify-content:center;font-size:1rem}
.rich{background:var(--bg);border-bottom:1px solid var(--line);border-radius:var(--ctl);padding:10px 12px;min-height:6em;overflow-wrap:anywhere}
.rich h3{font-size:1.05rem;margin:8px 0 4px}
.rich ul,.rich ol{padding-left:24px;margin:4px 0}
.srcs a{color:var(--accent);overflow-wrap:anywhere;font-size:.9rem;display:block}
.page{padding:16px 0;border-top:var(--rule);display:flex;flex-direction:column;gap:8px}
.looks{display:flex;gap:8px;flex-wrap:wrap}
.strow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px;align-items:center;margin-bottom:4px}
.check{display:flex;gap:12px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}

/* dialog and toast */
dialog{border:var(--rule);border-radius:var(--radius);background:var(--surface);color:var(--ink);padding:24px;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:1.3rem;margin-bottom:12px}
dialog form,.dbody{display:flex;flex-direction:column;gap:12px}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.choice{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid transparent;border-radius:var(--ctl);padding:12px 16px}
.choice:hover{border-color:var(--ink)}
.choice b{display:block}
.choice span{color:var(--muted);font-size:.9rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  border-radius:var(--ctl);padding:10px 16px;font-size:.92rem;display:flex;gap:16px;align-items:center;max-width:calc(100vw - 32px);z-index:20}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
</style>
</head>
<body data-view="home">
<div class="wrap">
  <div id="gate" hidden>
    <form id="gate-form" autocomplete="off">
      <h1>Jobs</h1>
      <p id="gate-msg" role="alert"></p>
      <label class="fld"><span>Passcode</span><input type="password" id="gate-code" autocomplete="off" autocapitalize="none" spellcheck="false" required></label>
      <button class="add" id="gate-go">Open</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="titlebar"><h1>Jobs</h1><div id="today"></div></div>
      <input type="search" class="search" id="search" placeholder="Search" aria-label="Search jobs, notes and evidence">
      <button class="add" data-act="add-role" id="add-role" data-ic="plus">Add job</button>
    </header>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-act="nav" data-v="week" id="nav-week" data-ic="week">This week</button>
      <button class="tab" data-act="nav" data-v="jobs" id="nav-jobs" data-ic="jobs">Saved jobs</button>
      <button class="tab" data-act="nav" data-v="evidence" id="nav-evidence" data-ic="evidence">Evidence</button>
      <button class="tab" data-act="nav" data-v="notebook" id="nav-notebook" data-ic="notebook">Notebook</button>
      <button class="tab" data-act="nav" data-v="settings" id="nav-settings" data-ic="settings">Settings</button>
    </nav>
    <p id="banner" hidden></p>
    <div class="shell">
      <main id="home"></main>
      <section id="pane" aria-live="off"></section>
    </div>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
"use strict";
/* =====================================================================
   CONFIG
   ===================================================================== */
// Web config for the existing Firebase project. Public by design; the security
// lives in the database rules (see game/firebase-rules.json, "jobs" block).
const FIREBASE_CONFIG = {

// Dates are never shown as bare numbers: always weekday, day and month name,
// plus the year whenever it is not the current one.
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const parseIso = s => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ""); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
const otherYear = d => d.getFullYear() !== new Date().getFullYear();
function fmtDate(s){ const d = parseIso(s); return d ? DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + (otherYear(d) ? " " + d.getFullYear() : "") : ""; }

function daysFrom(s){ return Math.round((parseIso(s) - parseIso(iso(new Date()))) / 864e5); }
function rel(s){ const n = daysFrom(s); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n > 1 ? "In " + n + " days" : n === -1 ? "Yesterday" : (-n) + " days ago"; }

function localSet(path, val){
  const parts = path.split("/").filter(Boolean); let o = D;
  for(let i = 0; i < parts.length - 1; i++){ if(typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const k = parts[parts.length - 1];
  if(val === null || val === undefined) delete o[k]; else o[k] = val;
}
function saveErr(){ toast("Couldn't save."); }
const store = {

  update(p, o){ if(!this.ok()) return; if(DEMO){ Object.keys(o).forEach(k => localSet(p + "/" + k, o[k])); return; } db.ref(BASE + p).update(o).catch(saveErr); },
  remove(p){ this.set(p, null); }
};

const roleList = () => Object.keys(D.roles).map(id => Object.assign({ id }, D.roles[id]));
const isLive = r => !r.removedAt && !r.closed;
function statusList(){ return Object.keys(D.statuses).map(id => ({ id, name:D.statuses[id].name || "", order:D.statuses[id].order || 0 })).sort((a,b) => a.order - b.order); }
function statusOf(r){ const s = statusList(); return s.find(x => x.id === r.status) || s[0] || { id:"", name:"" }; }
function dateList(r){ return Object.keys(r.dates || {}).map(id => Object.assign({ id }, r.dates[id])).sort((a,b) => ((a.date||"9999") + (a.time||"")).localeCompare((b.date||"9999") + (b.time||"")) || (a.at||0) - (b.at||0)); }
// Everything still ahead for a job: its own dates plus the closing date, earliest first.
function upcoming(r){

  if(r.closing && !r.closingDone) out.push({ id:"__closing", label:"Closes", date:r.closing });
  return out.sort((a,b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")));
}
function todoList(r){ return Object.keys(r.todos || {}).map(id => Object.assign({ id }, r.todos[id])).sort((a,b) => (a.at||0) - (b.at||0)); }
const roleName = r => (r.company || "Untitled") + (r.title ? ", " + r.title : "");

  $("home").innerHTML = homeHtml();
  $("pane").innerHTML = view.name === "role" ? roleHtml(view.id) : view.name === "notebook" ? notebookHtml() : view.name === "evidence" ? evidenceHtml() : view.name === "settings" ? settingsHtml() : paneEmpty();

const TIPS = {

function head(k, label){

}
function paneEmpty(){ return `<div class="panel"><p class="empty">No job selected.</p></div>`; }

// A date drawn as a small calendar leaf: month band, day number, weekday (plus year if not this one).
function dayChip(s, sm){
  const d = parseIso(s); if(!d) return "";
  return `<div class="day${sm ? " sm" : ""}${daysFrom(s) === 0 ? " today" : ""}" title="${fmtDate(s)}"><i>${MONTHS[d.getMonth()]}</i><b>${d.getDate()}</b><span>${DAYS[d.getDay()]}${otherYear(d) ? " " + d.getFullYear() : ""}</span></div>`;
}
// Seven days at a glance, with a dot for each thing due. Decorative: the list below says it all.
function weekStrip(soon){
  const t = parseIso(iso(new Date())).getTime();

    return `<div class="sd${i === 0 ? " now" : ""}"><span>${DAYS[d.getDay()]}</span><b>${d.getDate()}</b><em>${"<i></i>".repeat(n)}</em></div>`;
  }).join("") + `</div>`;
}
// One happy moment: a short burst of confetti in the look's own colours when a job reaches the last status.
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"), g = c.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--hi","--ink","--line"].map(v => cs.getPropertyValue(v).trim()), W = c.width = innerWidth, H = c.height = innerHeight;
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:30";
  document.body.appendChild(c);
  const ps = Array.from({ length:70 }, () => ({ x:W / 2, y:H * .35, vx:(Math.random() - .5) * 14, vy:-Math.random() * 12 - 3, r:Math.random() * 5 + 3, c:cols[Math.floor(Math.random() * cols.length)], a:Math.random() * 6 }));
  const t0 = performance.now();
  (function step(now){
    const k = (now - t0) / 1400; g.clearRect(0, 0, W, H);
    if(k >= 1){ c.remove(); return; }
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; g.globalAlpha = 1 - k; g.fillStyle = p.c; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); });

function homeHtml(){
  const roles = roleList().filter(r => !r.removedAt);

function weekHtml(roles){

  items.sort((a,b) => (a.d.date + (a.d.time||"")).localeCompare(b.d.date + (b.d.time||"")));
  const soon = items.filter(x => x.d.date <= lim), later = items.filter(x => x.d.date > lim);

// Saved jobs: one table, filtered by status. "Past" is a quiet, uncounted filter at the end.
function jobsHtml(roles){

// Notebook formatting. Notes are stored as a small, cleaned subset of HTML: only the tags
// below survive, with every attribute stripped, both when saving and when showing.
const FMT = [["bold","Bold","<b>B</b>"],["italic","Italic","<i>I</i>"],["h","Heading","<b>H</b>"],
  ["ul","Bullet list",'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg>'],
  ["ol","Numbered list",'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7h10M10 12h10M10 17h10M4 6l1.5-1v4M4 15h2.5L4 18h2.5"/></svg>']];
const RICH_OK = { B:1, STRONG:1, I:1, EM:1, U:1, H3:1, UL:1, OL:1, LI:1, P:1, DIV:1, BR:1 };
function cleanHtml(html){
  const doc = new DOMParser().parseFromString("<div>" + String(html || "") + "</div>", "text/html"), out = doc.createElement("div");
  (function walk(from, to){
    from.childNodes.forEach(n => {
      if(n.nodeType === 3){ to.appendChild(doc.createTextNode(n.nodeValue)); return; }
      if(n.nodeType !== 1 || /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META)$/.test(n.tagName)) return;
      if(RICH_OK[n.tagName]){ const el = doc.createElement(n.tagName); to.appendChild(el); walk(n, el); } else walk(n, to);
    });
  })(doc.body.firstChild, out);
  return out.innerHTML;
}
// Notes written before formatting existed are plain text: keep their line breaks.
const richHtml = pg => pg.fmt === "html" ? cleanHtml(pg.body) : esc(pg.body || "").replace(/\n/g, "<br>");
function saveRich(el, now){
  const path = el.dataset.rich, key = path + "/body"; clearTimeout(timers[key]);
  const run = () => store.update(path, { body:cleanHtml(el.innerHTML), fmt:"html" });
  if(now) run(); else timers[key] = setTimeout(run, 600);
}

function buildPrompt(r){
  const cv = !!D.settings.cv, L = [];
  L.push("I am applying for a job and need help preparing. Use web search for anything about the employer, and only state things you can support with a source. If you cannot find reliable information for a section, write \"Nothing reliable found\" instead of guessing. Never invent names of people.");
  L.push("", "THE ROLE", "Company: " + (r.company || "not given"), "Job title: " + (r.title || "not given"));
  if(r.link) L.push("Advert link: " + r.link);
  if(r.location) L.push("Location: " + r.location);
  if(r.mode) L.push("Working pattern: " + r.mode + (r.mode === "Hybrid" && r.hybrid ? " (" + r.hybrid + ")" : ""));
  if(r.advert) L.push("", "ADVERT TEXT", '"""', r.advert.trim(), '"""');
  else L.push("", "I have not pasted the advert text. If you cannot open the link, say so under ADVERT SUMMARY and carry on with the other sections.");
  L.push("", "HOW TO REPLY",
    "Reply with ONE code block and nothing before or after it, so I can copy the whole reply in one go.",
    "Inside the code block use exactly these headings, in this order, each on its own line starting with ##.",
    "Under each heading write plain text in short bullet points starting with \"- \". No bold, no tables, no extra headings. Use British English.",
    "", "## KEY FACTS", "Salary: (as stated in the advert, or \"not stated\")", "Closing date: (as YYYY-MM-DD, or \"not stated\")", "Location: (as stated in the advert, or \"not stated\")",
    "## ADVERT SUMMARY", "(3 to 5 bullets on what the job involves day to day)",
    "## KEY REQUIREMENTS", "(must-haves first, then nice-to-haves, each labelled)",
    "## COMPANY", "(what they do, size, anything notable from the last 12 months, what they say about their culture)",
    "## DEPARTMENT", "(the team this role sits in: what it does, how it fits the organisation, anything public about its current priorities)",
    "## QUESTIONS TO ASK", "(5 questions I could ask at interview, specific to this employer and role)");
  if(cv) L.push("## HOW I FIT", "(using my CV in this project: my strongest matches, any gaps and how to address them, and 3 examples from my experience worth preparing)");
  L.push("## SOURCES", "(one full web address per line for each source you used)");
  return L.join("\n");
}
function parseReply(txt){
  const out = {}, lines = String(txt || "").replace(/\r/g, "").split("\n");
  let key = null, found = 0;
  lines.forEach(line => {
    if(/^\s*```/.test(line)) return;                       // drop code-fence lines
    const m = /^\s*#{1,4}\s*\**\s*([A-Za-z ]+?)\s*\**\s*:?\s*$/.exec(line), k = m && HEADINGS[m[1].toUpperCase().replace(/\s+/g, " ")];
    if(k){ key = k; found++; out[key] = out[key] || ""; return; }
    if(key) out[key] += line + "\n";
  });
  if(!found) return { research:{ raw:String(txt).trim() }, facts:{} };
  const facts = {}, stated = v => v && !/^\(?\s*not stated/i.test(v) ? v.trim() : "";
  (out.facts || "").split("\n").forEach(l => {
    const m = /^\s*[-*]?\s*(salary|closing date|location)\s*:\s*(.+)$/i.exec(l); if(!m) return;
    const f = m[1].toLowerCase(), v = stated(m[2]); if(!v) return;
    if(f === "closing date"){ const d = /(\d{4}-\d\d-\d\d)/.exec(v); if(d && parseIso(d[1])) facts.closes = d[1]; }
    else facts[f] = v;
  });
  const research = {};
  Object.keys(out).forEach(k => { if(k !== "facts" && out[k].trim()) research[k] = out[k].trim(); });
  return { research, facts };
}

    <div><button class="add" data-act="copy-prompt">${ic("copy")}Copy prompt</button></div>
    <form data-form="file-reply" data-id="${id}"><textarea name="reply" id="reply-text" rows="5" placeholder="Paste reply" aria-label="ChatGPT's reply" required></textarea>

  const p = parseReply(txt), merged = Object.assign({}, r.research || {}, p.research);
  store.set("roles/" + id + "/research", merged);
  const offers = [];
  if(p.facts.salary && !r.salary) offers.push(["salary", "Salary: " + p.facts.salary, p.facts.salary, true]);
  if(p.facts.location && !r.location) offers.push(["location", "Location: " + p.facts.location, p.facts.location, true]);
  if(p.facts.closes && !r.closing) offers.push(["closes", "Closing date: " + fmtDate(p.facts.closes), p.facts.closes, true]);
  if(!offers.length){ closeDlg(); toast(p.research.raw ? "Filed unsorted." : "Filed."); return; }
  openDlg(`<h2>Add from reply?</h2><form data-form="apply-facts" data-id="${id}">    ${offers.map(o => `<div class="check"><input type="checkbox" id="of-${o[0]}" name="${o[0]}" value="${esc(o[2])}"${o[3] ? " checked" : ""}><label for="of-${o[0]}">${esc(o[1])}</label></div>`).join("")}
    <div class="row"><button class="add">Add ticked</button><button type="button" class="ghost" data-act="dlg-close">Skip</button></div></form>`);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function go(name, id){ location.hash = name === "role" ? "role-" + id : name === "home" ? listTab : name; }
function route(){
  const hsh = location.hash.replace(/^#/, ""), m = /^role-(.+)$/.exec(hsh);
  if(hsh === "week" || hsh === "jobs") listTab = hsh;
  view = m ? { name:"role", id:m[1] } : (hsh === "notebook" || hsh === "settings" || hsh === "evidence") ? { name:hsh, id:null } : { name:"home", id:null };
  const paint = () => { render(); window.scrollTo(0, 0); $("pane").scrollTop = 0; };
  // A short cross-fade between views, built into the browser. Skipped if motion is reduced.
  if(document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(paint); else paint();
}
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function applyLook(l){ if(!LOOKS.some(x => x[0] === l)) l = "allotment"; document.documentElement.dataset.look = l; ls("jobs-look", l); }

const ACT = {
  "nav": el => go(el.dataset.v),
  "open": el => go("role", el.dataset.id),
  "add-role": addRoleDlg,
  "dlg-close": closeDlg,
  "help": helpDlg,
  "undo": () => { const u = toastUndo; $("toast").hidden = true; toastUndo = null; if(u){ u(); render(); } },
  "stickers": el => stickerDlg(el.dataset.id),
  "stk-add": el => {
    const id = el.dataset.id, host = document.querySelector("#pane .jobpanel"), top = host ? host.getBoundingClientRect().top : 0, sid = newId();
    // drop it where she is looking, a little to the right, at a slight random tilt
    store.set("roles/" + id + "/stickers/" + sid, { k:el.dataset.k, x:Math.round(45 + Math.random() * 30), y:Math.round(Math.max(8, 260 - top + Math.random() * 80)), r:Math.round(Math.random() * 24 - 12), s:2 });
    closeDlg(); render();
  },
  "stk-size": el => {
    const r = D.roles[view.id], k = r && r.stickers && r.stickers[ui.stk]; if(!k) return;
    const n = Math.max(0, Math.min(STK_SIZES.length - 1, (k.s == null ? 2 : k.s) + (+el.dataset.d)));
    store.update("roles/" + view.id + "/stickers/" + ui.stk, { s:n }); render();
  },
  "stk-del": () => { const path = "roles/" + view.id + "/stickers/" + ui.stk, old = ((D.roles[view.id] || {}).stickers || {})[ui.stk]; ui.stk = null; store.remove(path); render(); toast("Sticker removed.", () => store.set(path, old)); },
  "tip": el => { ui.tip = ui.tip === el.dataset.k ? null : el.dataset.k; render(); },
  "filter": el => { ui.filter = el.dataset.k; render(); },
  "sort": el => { ui.sort = el.dataset.k; render(); },
  "toggle-later": () => { ui.later = !ui.later; render(); },
  "set-status": el => { store.update("roles/" + el.dataset.id, { status:el.dataset.s }); render(); },
  "date-done": el => {
    const id = el.dataset.id, d = el.dataset.d;
    if(d === "__closing"){ store.update("roles/" + id, { closingDone:true }); render(); toast("Done.", () => store.update("roles/" + id, { closingDone:null })); return; }
    const p = "roles/" + id + "/dates/" + d; store.update(p, { done:true }); render(); toast("Done.", () => store.update(p, { done:false }));
  },
  "add-date": el => { const d = newId(); store.set("roles/" + el.dataset.id + "/dates/" + d, { label:"", at:Date.now() }); render("dl-" + d); },
  "del-date": el => { store.remove("roles/" + el.dataset.id + "/dates/" + el.dataset.d); render(); },
  "del-todo": el => { store.remove("roles/" + el.dataset.id + "/todos/" + el.dataset.d); render(); },
  "close-role": el => closeRoleDlg(el.dataset.id),
  "close-as": el => { const id = el.dataset.id; store.update("roles/" + id, { closed:{ type:el.dataset.t, at:Date.now() } }); closeDlg(); go("home"); render(); toast("Moved to Past.", () => store.update("roles/" + id, { closed:null })); },
  "remove": el => { const id = el.dataset.id; store.update("roles/" + id, { removedAt:Date.now() }); closeDlg(); go("home"); render(); toast("Removed.", () => store.update("roles/" + id, { removedAt:null })); },
  "reopen": el => { store.update("roles/" + el.dataset.id, { closed:null }); render(); },
  "restore": el => { store.update("roles/" + el.dataset.id, { removedAt:null }); render(); toast("Restored."); },
  "prepare": el => prepareDlg(el.dataset.id),
  "copy-prompt": () => {
    const t = $("prompt-text"), done = () => toast("Copied.");
    const manual = () => { t.focus(); t.select(); try{ document.execCommand("copy") ? done() : toast("Copy failed. Select the text and copy it."); }catch(e){ toast("Copy failed. Select the text and copy it."); } };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, manual); else manual();
  },
  "clear-research": el => { const id = el.dataset.id, old = (D.roles[id] || {}).research || null; store.remove("roles/" + id + "/research"); render(); toast("Research cleared.", () => store.set("roles/" + id + "/research", old)); },
  "add-ev": () => { const id = newId(); store.set("evidence/" + id, { q:"", at:Date.now() }); render("ev-" + id); },
  "del-ev": el => { const id = el.dataset.id, old = D.evidence[id]; store.remove("evidence/" + id); render(); toast("Example deleted.", () => store.set("evidence/" + id, old)); },
  "rehearse": () => { const id = pickEv(null); if(id){ ui.reh = { id, shown:false }; render(); window.scrollTo(0, 0); } },
  "reh-show": () => { ui.reh.shown = true; render(); },
  "reh-next": () => { const id = pickEv(ui.reh.id); if(id){ ui.reh = { id, shown:false }; render(); window.scrollTo(0, 0); } },
  "reh-stop": () => { ui.reh = null; render(); },
  "add-page": () => { const id = newId(); store.set("notebook/" + id, { title:"", body:"", at:Date.now() }); render("nt-" + id); },
  "del-page": el => { const id = el.dataset.id, old = D.notebook[id]; store.remove("notebook/" + id); render(); toast("Note deleted.", () => store.set("notebook/" + id, old)); },
  "look": el => { store.update("settings", { theme:el.dataset.l }); applyLook(el.dataset.l); render(); },
  "st-move": el => {
    const s = statusList(), i = s.findIndex(x => x.id === el.dataset.id), j = i + (+el.dataset.dir);
    if(i < 0 || j < 0 || j >= s.length) return;
    [s[i], s[j]] = [s[j], s[i]];
    s.forEach((x, n) => store.update("statuses/" + x.id, { order:(n + 1) * 10 })); render();
  },
  "st-del": el => {
    const s = statusList(), id = el.dataset.id, t = s.find(x => x.id === id), other = s.find(x => x.id !== id);
    if(!t || !other) return;
    const used = roleList().filter(r => r.status === id);
    if(used.length && !confirm("Delete \"" + t.name + "\"? " + used.length + (used.length === 1 ? " job" : " jobs") + " will move to \"" + other.name + "\".")) return;
    used.forEach(r => store.update("roles/" + r.id, { status:other.id }));
    store.remove("statuses/" + id); render();
  },
  "export-json": () => download("jobs-backup-" + iso(new Date()) + ".json", JSON.stringify({ exported:new Date().toISOString(), version:"1.7", data:D }, null, 2), "application/json"),
  "export-csv": () => {
    const cell = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const rows = [["Company","Job title","Status","Salary","Closing date","Location","Working pattern","Hybrid details","Link","Added","Outcome","Notes"]].concat(roleList().filter(r => !r.removedAt).map(r =>
      [r.company, r.title, r.closed ? "" : statusOf(r).name, r.salary, r.closing, r.location, r.mode, r.hybrid, r.link, r.created ? iso(new Date(r.created)) : "", r.closed ? (CLOSED[r.closed.type] || "Closed") : "", r.notes]));
    download("jobs-roles-" + iso(new Date()) + ".csv", "﻿" + rows.map(r => r.map(cell).join(",")).join("\r\n"), "text/csv");
  },
  "lock": () => {
    if(DEMO){ toast("Demo."); return; }
    if(!confirm("Sign out on this device?")) return;
    ls("jobs-cache", null);
    const done = () => location.reload();
    if(db && uid) db.ref("jobs/grants/" + uid).remove().then(done, done); else done();
  }
};

const FORMS = {
  "new-role": f => {
    const id = newId(), s = statusList()[0];
    store.set("roles/" + id, { company:f.company.value.trim(), title:f.title.value.trim(), link:f.link.value.trim() || null, status:s ? s.id : null, created:Date.now() });
    closeDlg(); $("search").value = ""; q = ""; listTab = "jobs"; ui.filter = "all"; go("role", id); render();
  },
  "new-date": f => { store.set("roles/" + f.dataset.id + "/dates/" + newId(), { label:f.label.value.trim(), date:f.date.value, time:f.time.value || null }); render("date-new"); },
  "new-todo": f => { store.set("roles/" + f.dataset.id + "/todos/" + newId(), { t:f.t.value.trim(), at:Date.now() }); render("todo-new"); },
  "new-status": f => { const s = statusList(); store.set("statuses/" + newId(), { name:f.name.value.trim(), order:(s.length ? s[s.length - 1].order : 0) + 10 }); render("status-new"); },
  "file-reply": f => { fileReply(f.dataset.id, f.reply.value); render(); },
  "apply-facts": f => {
    const id = f.dataset.id, o = {};
    if(f.salary && f.salary.checked) o.salary = f.salary.value;
    if(f.location && f.location.checked) o.location = f.location.value;
    if(f.closes && f.closes.checked) o.closing = f.closes.value;
    if(Object.keys(o).length) store.update("roles/" + id, o);
    closeDlg(); render(); toast("Filed.");
  }
};

const timers = {};
function saveField(el, now){
  const path = el.dataset.path, f = el.dataset.f; if(!path || !f) return;
  const key = path + "/" + f; clearTimeout(timers[key]);
  const run = () => { const v = el.type === "checkbox" ? el.checked : el.value, o = {}; o[f] = (v === "" || v === false) ? null : v; store.update(path, o); };
  if(now) run(); else timers[key] = setTimeout(run, 600);
}

document.addEventListener("click", e => {
  if(e.target === $("dlg")){ closeDlg(); return; }             // tap on the backdrop
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(fn){ if(el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault(); fn(el); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, fn = FORMS[f.dataset.form]; if(fn) fn(f);
});
// Stickers: drag to move, tap to select. Positions are saved when the finger or mouse lifts.
let drag = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest && e.target.closest(".stk");
  if(!el){ if(ui.stk && !(e.target.closest && e.target.closest(".stkbar"))){ ui.stk = null; document.querySelectorAll(".stk.on").forEach(x => x.classList.remove("on")); document.querySelectorAll(".stkbar").forEach(x => x.remove()); } return; }
  e.preventDefault();
  const r = el.getBoundingClientRect();
  drag = { el, dx:e.clientX - r.left - r.width / 2, dy:e.clientY - r.top - r.height / 2, sx:e.clientX, sy:e.clientY, moved:false };
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener("pointermove", e => {
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
  drag.moved = true;
  const host = drag.el.parentElement.getBoundingClientRect(), w = drag.el.offsetWidth, hgt = drag.el.offsetHeight;
  const x = Math.max(0, Math.min(host.width - w, e.clientX - drag.dx - w / 2 - host.left)), y = Math.max(0, Math.min(host.height - hgt, e.clientY - drag.dy - hgt / 2 - host.top));
  drag.x = Math.round(x / host.width * 1000) / 10; drag.y = Math.round(y);
  drag.el.style.left = drag.x + "%"; drag.el.style.top = drag.y + "px";
  document.querySelectorAll(".stkbar").forEach(b => b.remove());
});
function endDrag(){
  if(!drag) return;
  const d = drag; drag = null;
  if(d.moved) store.update("roles/" + d.el.dataset.id + "/stickers/" + d.el.dataset.sid, { x:d.x, y:d.y });
  else ui.stk = ui.stk === d.el.dataset.sid ? null : d.el.dataset.sid;
  render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
// Formatting buttons act on the selection, so they must not take focus away from the note.
document.addEventListener("mousedown", e => { if(e.target.closest("[data-fmt]")) e.preventDefault(); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-fmt]"); if(!b) return;
  const box = b.closest(".page").querySelector(".rich"), c = b.dataset.fmt;
  if(!box.contains(document.activeElement) && document.activeElement !== box) box.focus();
  if(c === "h") document.execCommand("formatBlock", false, document.queryCommandValue("formatBlock").toLowerCase() === "h3" ? "div" : "h3");
  else document.execCommand(c === "ul" ? "insertUnorderedList" : c === "ol" ? "insertOrderedList" : c);
  saveRich(box, false);
});
// Pasting brings plain text only, so nothing odd from other apps ends up in a note.
document.addEventListener("paste", e => {
  if(!e.target.closest || !e.target.closest(".rich")) return;
  e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
});
document.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset && el.dataset.rich){ saveRich(el, false); return; }
  if(el.id === "search"){ q = el.value.trim(); if(q && view.name !== "home") go("home"); else render(); return; }
  if(el.tagName === "TEXTAREA") grow(el);
  if(el.dataset.f && el.type !== "checkbox") saveField(el, false);
});
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.chg === "status"){
    if(el.value === "__close"){ closeRoleDlg(el.dataset.id); render(); }
    else {
      const sl = statusList(), last = sl[sl.length - 1], was = statusOf(D.roles[el.dataset.id] || {}).id;
      store.update("roles/" + el.dataset.id, { status:el.value }); render();
      if(sl.length > 1 && last && el.value === last.id && was !== last.id) burst();
    }
    return;
  }
  if(el.dataset.f){
    saveField(el, true);
    if(el.dataset.f === "closing") store.update(el.dataset.path, { closingDone:null });
    if(el.type === "checkbox" || el.dataset.rr) render(el.dataset.rr ? el.id : undefined);
  }
});
document.addEventListener("focusout", () => setTimeout(() => { if(pending && !editing()) render(); }, 0));
window.addEventListener("hashchange", route);

/* =====================================================================
   BOOT: demo, offline copy, or passcode lookup then live data
   ===================================================================== */
function showApp(){
  $("gate").hidden = true; $("app").hidden = false;
  $("today").innerHTML = dayChip(iso(new Date()), true);
  route();
}
function showGate(msg){
  clearTimeout(bootTimer); $("app").hidden = true; $("gate").hidden = false;
  if(msg) $("gate-msg").textContent = msg;
  $("gate-code").focus();
}
function showCached(reason){
  let c = null; try{ c = JSON.parse(ls("jobs-cache") || "null"); }catch(e){}
  if(!c){ showGate(reason); $("gate-go").disabled = true; return; }
  D = norm(c); readOnly = true; applyLook(D.settings.theme); showApp();
  banner("Offline. Read only.");
}
function seedIfNew(){
  if(D.settings.seeded || Object.keys(D.statuses).length) return;
  const up = {}; let t = Date.now();
  DEFAULT_STATUSES.forEach((n, i) => { up["statuses/s" + (i + 1)] = { name:n, order:(i + 1) * 10 }; });
  STARTER_PAGES.forEach((n, i) => { up["notebook/n" + (i + 1)] = { title:n, body:"", at:t + i }; });
  up["settings/seeded"] = true;
  db.ref("jobs/data").update(up).catch(saveErr);
}
function purgeOld(){
  if(purged) return; purged = true;
  const cut = Date.now() - KEEP_REMOVED_DAYS * 864e5;
  roleList().forEach(r => { if(r.removedAt && r.removedAt < cut) store.remove("roles/" + r.id); });
}
function subscribe(){
  db.ref("jobs/grants/" + uid).once("value").then(g => db.ref("jobs/access/" + g.val()).once("value"))
    .then(a => { who = (a.val() && a.val().name) || ""; if(live && view.name === "settings") onData(); }).catch(() => {});
  db.ref("jobs/data").on("value", s => {
    clearTimeout(bootTimer);
    const first = !live; live = true; readOnly = false;
    D = norm(s.val()); ls("jobs-cache", JSON.stringify(D)); applyLook(D.settings.theme);
    seedIfNew(); purgeOld();
    if(first){ banner(""); showApp(); } else onData();
  }, () => {
    // The rules refused us: the passcode was changed or removed in the console.
    live = false; db.ref("jobs/data").off(); db.ref("jobs/grants/" + uid).remove().catch(() => {}); ls("jobs-cache", null);
    showGate("Passcode changed. Enter the new one.");
  });
  db.ref(".info/connected").on("value", s => { if(live) banner(s.val() === true ? "" : "Offline. Changes save when you reconnect."); });
}
$("gate-form").addEventListener("submit", e => {
  e.preventDefault(); e.stopPropagation();
  // Typed however she likes (spaces, capitals, hyphens); only letters and digits are used.
  const code = $("gate-code").value.toLowerCase().replace(/[^a-z0-9]/g, "");
  if(code.length < 6){ $("gate-msg").textContent = "Wrong passcode."; return; }
  $("gate-go").disabled = true;
  db.ref("jobs/access/" + code).once("value")
    .then(s => { if(!s.exists()) throw new Error("nomatch"); return db.ref("jobs/grants/" + uid).set(code); })
    .then(() => { $("gate-code").value = ""; subscribe(); })
    .catch(err => { $("gate-msg").textContent = err && err.message === "nomatch" ? "Wrong passcode." : "Can't connect. Try again."; })
    .then(() => { $("gate-go").disabled = false; });
});

function demoData(){
  const t = Date.now(), day = n => iso(new Date(t + n * 864e5));
  const d = blank();
  DEFAULT_STATUSES.forEach((n, i) => { d.statuses["s" + (i + 1)] = { name:n, order:(i + 1) * 10 }; });
  STARTER_PAGES.forEach((n, i) => { d.notebook["n" + (i + 1)] = { title:n, body:"", at:t + i }; });
  d.roles = {
    r1:{ company:"Holburne Museum", title:"Visitor Experience Lead", status:"s4", salary:"£29,500 a year", location:"Bath", link:"https://example.org/jobs/visitor-experience-lead", created:t - 9e8,
         notes:"Panel is the Head of Operations plus one trustee.", dates:{ a:{ label:"Interview", date:day(4), time:"14:00" } }, todos:{ a:{ t:"Print two copies of CV", at:1 }, b:{ t:"Ask about weekend rota", at:2 } }, stickers:{ a:{ k:"t1f986", x:70, y:40, r:-8, s:2 }, b:{ k:"greyhound", x:55, y:300, r:6, s:3 } } },
    r2:{ company:"Julian House", title:"Fundraising Officer", status:"s3", created:t - 7e8, dates:{ a:{ label:"Follow up by email", date:day(6) } } },
    r3:{ company:"Bath Spa University", title:"Events Coordinator", status:"s2", created:t - 5e8, dates:{ a:{ label:"Application closes", date:day(2) } } },
    r4:{ company:"Royal United Hospitals", title:"Patient Experience Coordinator", status:"s1", created:t - 3e8, dates:{ a:{ label:"Application closes", date:day(45) } } },
    r5:{ company:"Future Publishing", title:"Production Assistant", status:"s1", created:t - 2e8 },
    r6:{ company:"Komedia", title:"Office Manager", status:"s3", created:t - 12e8, closed:{ type:"unsuccessful", at:t - 2e8 } }
  };
  d.evidence = { e1:{ q:"A time you dealt with a difficult customer", s:"Saturday shift, a visitor was upset about a cancelled tour.", t:"Calm things down and keep the queue moving.", a:"Listened, apologised, offered the next slot and a cafe voucher.", r:"They stayed, and left a five-star review that week.", at:1 },
    e2:{ q:"A time you improved a process", a:"Replaced the paper rota with a shared sheet.", r:"Cut swap requests by about half.", at:2 } };
  return d;
}

function boot(){
  applyLook(ls("jobs-look") || "allotment");
  if(DEMO){ D = demoData(); who = "Demo"; showApp(); banner("Demo. Nothing is saved."); return; }
  if(typeof firebase === "undefined"){ showCached("Can't connect."); return; }
  firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database();
  // If nothing has arrived after a few seconds we are probably offline: show the last saved copy.
  bootTimer = setTimeout(() => { if(!live) showCached("Can't connect."); }, 7000);
  firebase.auth().signInAnonymously()
    .then(c => { uid = c.user.uid; return db.ref("jobs/grants/" + uid).once("value"); })
    .then(s => { if(s.exists()) subscribe(); else showGate(); })
    .catch(() => { clearTimeout(bootTimer); if(!live) showCached("Can't connect."); });
}
document.querySelectorAll("[data-ic]").forEach(e => e.insertAdjacentHTML("afterbegin", ic(e.dataset.ic)));
boot();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
