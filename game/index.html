<!DOCTYPE html>
<!--
  Find the codes : the wedding QR game, guest page
  Lorraine & Richard, Monday 21 September 2026

  Changelog
  v4.0 (12/09/2026): One quilt block and colour per code, unique across the ten, carried through the
          heading, patch strips, icons, buttons, found meter, rows, results and the reveal flash.
          Two separate tombolas side by side: the item drum rolls down, the role drum rolls up, on
          different clocks.
  v3.0 (12/09/2026): Physicality pass. Every statement, answered row, tie-breaker and results block
          is a raised patch with a quilt strip along its top and a real shadow; unfound rows sit
          flat behind them. Buttons have a solid face and a darker bottom edge that presses down
          on tap, with a small pop when a pick lands.
  v2.0 (12/09/2026): Second pass on look and feel after review. The card floats on the invite's
          sky, glow and motes again with the full quilt band and Mr Robin. Rust for Richard and
          Lorraine, olive for Eric and Tango, on icons, buttons and picked names. Ochre tab strip,
          luggage-tag alias, framed tombola with pointers, ten quilt blocks as the found-so-far
          meter, big ochre numerals behind code headings, medal blocks on the leaderboard.
          Eyebrow labels and explanatory copy cut.
  v1.0 (12/09/2026): First build from spec v55. Tombola alias reels with two re-spins,
          alias claimed by Firebase transaction and pinned to the header. Codes resolved
          from /game/codes (random five-character codes, never listed). Three tabs: This
          code, My answers, Results, cross-fading via the View Transitions API with a CSS
          fallback. Answers commit on tap and can be changed on either tab until the host's
          countdown locks the game (server-enforced). Release-all opens every statement.
          Reveal is per code: a two-second full-screen right/wrong flash, then the Results
          tab with score tick, leaderboard and room split; rank card after the tenth.
          Tie-breaker (day and month in 2017) on the first code and as row 21.
          Icons pulled by URL from content.json and inlined so they take the theme colour.

  How it fits together
  - content.json next to this file holds the reels, statements and icon URLs. No answers.
  - Firebase Realtime Database, everything under /game. Rules in ../firebase-rules.json.
  - The host page is /game/host/ (behind the couple's passcode).
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0cfa4">
<title>Find the codes · Lorraine &amp; Richard</title>
<link rel="icon" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e7e0d2;
    --cream:#efe6d3;
    --ochre:#e0cfa4;
    --ochre-deep:#c9b585;
    --rust:#a34a2c;
    --rust-deep:#7e3820;
    --bark:#4a3f2f;
    --ink:#3b382f;
    --mutedbrown:#8a7256;
    --olive:#7a7c47;
    --olive-deep:#5e6035;
    --gold:#c99a3f;
    --terracotta:#bf6a43;
    --line:rgba(74,63,47,.18);
    --display:'Playfair Display',Georgia,serif;
    --body:'Cormorant Garamond',Georgia,serif;
    --label:'Marcellus',Georgia,serif;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100dvh;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:18px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:14px 12px 30px;
  }
  /* ---- The invite's environment: warm sky, breathing glow, motes ---- */
  .sky{
    position:fixed;inset:-12%;z-index:0;pointer-events:none;
    background:
      radial-gradient(42% 38% at 26% 22%, rgba(224,188,128,.42), transparent 72%),
      radial-gradient(40% 36% at 78% 74%, rgba(159,124,89,.30), transparent 72%),
      radial-gradient(46% 50% at 62% 40%, rgba(122,124,71,.18), transparent 74%),
      radial-gradient(38% 34% at 12% 82%, rgba(201,154,63,.20), transparent 72%),
      var(--paper);
    animation:sky-drift 30s ease-in-out infinite alternate;
  }
  @keyframes sky-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(2.5%,-2%,0) scale(1.08)}}
  .glow{position:fixed;top:50%;left:50%;width:540px;height:720px;transform:translate(-50%,-50%);z-index:0;pointer-events:none;
    background:radial-gradient(closest-side, rgba(244,226,188,.55), rgba(244,226,188,0) 76%);filter:blur(24px);animation:breathe 9s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.06)}}
  .motes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .mote{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle, rgba(255,248,232,.95), rgba(255,248,232,0) 70%);filter:blur(.6px);opacity:0;will-change:transform,opacity;animation:drift linear infinite}
  @keyframes drift{0%{opacity:0;transform:translateY(0) translateX(0) scale(.7)}12%{opacity:var(--o,.4)}88%{opacity:var(--o,.4)}100%{opacity:0;transform:translateY(-108vh) translateX(26px) scale(1.15)}}

  /* ---- The card: the invite, grown into a page ---- */
  .card{
    position:relative;z-index:1;
    width:100%;max-width:420px;
    min-height:calc(100dvh - 44px);
    background:var(--cream);
    box-shadow:0 18px 44px rgba(59,56,47,.22);
    display:flex;flex-direction:column;
    animation:card-in 1.1s var(--ease-out) both;
  }
  @keyframes card-in{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}

  .band{background:var(--ochre);display:flex;justify-content:center;align-items:center;gap:6px;padding:11px 0;overflow:hidden;flex:0 0 auto}
  .band .block{flex:0 0 auto;animation:bloom .6s ease both}
  .qb,.block,.pb{display:grid}
  .qb .cell,.block .cell,.pb .cell{width:100%;height:100%;display:block}
  @keyframes bloom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

  /* Header: a luggage-tag alias, the clock beneath */
  .top{padding:18px 22px 0;text-align:center;min-height:54px}
  .alias{
    display:inline-block;position:relative;
    font-family:var(--label);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--bark);background:var(--ochre);padding:9px 18px 8px 26px;
    clip-path:polygon(0 50%, 12px 0, 100% 0, 100% 100%, 12px 100%);
  }
  .alias[hidden]{display:none}
  .alias:before{content:'';position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--cream)}
  .alias.arrive{animation:alias-in .5s var(--ease-out) both}
  @keyframes alias-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .clock{font-family:var(--body);font-style:italic;font-size:18px;color:var(--mutedbrown);margin-top:8px;min-height:24px;transition:color .4s ease}
  .clock.soon{color:var(--rust);font-style:normal;font-weight:600}
  .clock.locked{color:var(--bark)}

  .screen{flex:1;display:flex;flex-direction:column}
  .screen[hidden]{display:none}

  /* ---- Spin screen ---- */
  #spin{padding:22px 24px 30px;justify-content:center;text-align:center}
  h1,h2,h3{font-family:var(--display);color:var(--bark);margin:0;font-weight:600}
  h1{font-size:30px;letter-spacing:.06em;line-height:1.15}
  .lede{font-style:italic;color:var(--mutedbrown);font-size:19px;margin:6px 0 22px}
  .tombolas{display:flex;gap:12px;justify-content:center;margin:0 auto;max-width:360px}
  .tombola{
    position:relative;flex:1;min-width:0;
    background:var(--ochre);padding:10px;
    box-shadow:0 10px 24px rgba(74,63,47,.16);
  }
  .tombola .lab{font-family:var(--label);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bark);text-align:center;margin:0 0 8px}
  .tombola .window{background:#f7f0e0;position:relative;box-shadow:inset 0 3px 10px rgba(74,63,47,.16)}
  .reel-wrap{position:relative}
  .reel-wrap:before,.reel-wrap:after{
    content:'';position:absolute;top:50%;width:0;height:0;margin-top:-6px;z-index:2;
    border-top:6px solid transparent;border-bottom:6px solid transparent;
  }
  .reel-wrap:before{left:0;border-left:8px solid var(--rust)}
  .reel-wrap:after{right:0;border-right:8px solid var(--rust)}
  .reel{height:156px;overflow:hidden;position:relative;
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
    mask-image:linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
  }
  .reel .strip{will-change:transform}
  .reel .word{height:52px;line-height:52px;font-family:var(--display);font-size:21px;color:var(--bark);white-space:nowrap;padding:0 10px;overflow:hidden;text-overflow:clip}
  @media (max-width:360px){.reel .word{font-size:18px}}
  .reel.spinning .strip{filter:blur(.6px)}
  .reel .word.hit{color:var(--rust)}
  .reel-hint{font-family:var(--label);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);margin:18px 0 4px;min-height:18px}
  .spin-actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:18px}
  .taken{font-style:italic;color:var(--rust);min-height:24px;margin-top:12px}
  #spin.lockin .tombola,#spin.lockin .spin-actions,#spin.lockin .lede,#spin.lockin h1,#spin.lockin .reel-hint{animation:lift .4s var(--ease-out) both}
  @keyframes lift{to{opacity:0;transform:translateY(-36px)}}

  /* Buttons: the invite's rust button, its ochre sibling */
  .btn{
    -webkit-appearance:none;appearance:none;border:0;background:var(--rust);color:var(--cream);
    font-family:var(--label);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    min-height:48px;padding:10px 24px;cursor:pointer;position:relative;
    transition:background .15s ease,color .15s ease,transform .08s ease,box-shadow .08s ease,opacity .15s ease;
    box-shadow:0 4px 0 var(--rust-deep), 0 8px 16px rgba(74,63,47,.18);
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rust-deep), 0 2px 4px rgba(74,63,47,.12)}
  .btn.ghost{background:var(--ochre);color:var(--bark);box-shadow:0 4px 0 var(--ochre-deep), 0 8px 16px rgba(74,63,47,.12)}
  .btn.ghost:active{box-shadow:0 1px 0 var(--ochre-deep), 0 2px 4px rgba(74,63,47,.1)}
  .btn:disabled{opacity:.42;cursor:default;transform:translateY(3px);box-shadow:0 1px 0 rgba(74,63,47,.25)}
  .btn.wide{width:100%}

  /* ---- Tabs: an ochre strip, the active one cut from cream ---- */
  .tabs{display:flex;margin:16px 22px 0;background:var(--ochre);padding:4px;gap:4px}
  .tab{
    flex:1;background:transparent;border:0;
    font-family:var(--label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--bark);
    min-height:44px;padding:10px 2px;cursor:pointer;position:relative;transition:background .15s ease,color .15s ease;
  }
  .tab[aria-selected="true"]{background:var(--cream);color:var(--rust);box-shadow:0 1px 3px rgba(74,63,47,.12)}
  .tab .badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--rust)}
  .panels{view-transition-name:panels;flex:1;padding:28px 22px 120px;position:relative}
  .panel[hidden]{display:none}
  .panel.enter{animation:panel-in .22s ease-out both}
  @keyframes panel-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  ::view-transition-old(panels){animation:vt-out .14s ease-out both}
  ::view-transition-new(panels){animation:panel-in .22s ease-out both}
  @keyframes vt-out{to{opacity:0}}

  /* Panel heading: Playfair with a big ochre numeral behind */
  .ph{position:relative;margin:0 0 18px;min-height:44px;display:flex;align-items:flex-end;gap:12px}
  .ph h2{font-size:26px;letter-spacing:.03em;line-height:1.1;position:relative}
  .ph .num{position:absolute;right:-4px;top:-26px;font-family:var(--display);font-weight:600;font-size:100px;line-height:1;color:var(--c,var(--ochre));opacity:.22;pointer-events:none;user-select:none;z-index:0}
  .ph .qb{width:40px;height:40px;flex:0 0 40px;margin-bottom:2px;position:relative;z-index:1;box-shadow:0 3px 8px rgba(74,63,47,.18)}
  .ph h2,.ph small{position:relative;z-index:1}
  .ph small{font-family:var(--label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mutedbrown);padding-bottom:5px}
  .note{font-style:italic;color:var(--mutedbrown);margin:0 0 16px;font-size:19px}

  /* The patch: every question, answer and result sits on one of these.
     A lighter cream face, a quilt strip along the top in its colour, a real shadow. */
  .patch{
    position:relative;background:#f7f0e0;padding:22px 18px 18px;margin:0 0 16px;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 12px 26px rgba(74,63,47,.16), 0 2px 4px rgba(74,63,47,.08);
    --c:var(--ochre-deep);--cd:var(--bark);
  }
  .patch:before{content:'';position:absolute;left:0;right:0;top:0;height:7px;
    background:repeating-linear-gradient(90deg, var(--c) 0 9px, var(--cream) 9px 18px)}
  .patch.gold{--c:var(--gold);--cd:#8a6a2a}
  /* Statement: the code's icon colour beside the words, two names beneath. */
  .stmt{padding:24px 18px 18px}
  .stmt-row{display:flex;gap:14px;align-items:flex-start}
  .stmt-row.dog{flex-direction:row-reverse}
  .icon{flex:0 0 52px;width:52px;height:52px;color:var(--c);display:flex;align-items:center;justify-content:center}
  .icon svg{width:48px;height:48px;stroke-width:1.5}
  .stmt-row.human .icon{transform:rotate(-8deg)}
  .stmt-row.dog .icon{transform:rotate(8deg)}
  .icon .fb{width:36px;height:36px}
  .stmt-text{flex:1;font-size:22px;line-height:1.3;color:var(--ink);margin:0}
  .choice{display:flex;gap:12px;margin-top:16px}
  .choice .btn{flex:1;padding:10px 6px}
  .choice .btn.pick{background:var(--cream);color:var(--cd);box-shadow:0 4px 0 var(--ochre-deep), 0 8px 16px rgba(74,63,47,.12)}
  .choice .btn.pick:active{box-shadow:0 1px 0 var(--ochre-deep), 0 2px 4px rgba(74,63,47,.1)}
  .choice .btn.pick.on{background:var(--cd);color:var(--cream);box-shadow:0 4px 0 color-mix(in srgb, var(--cd), #000 32%), 0 8px 16px rgba(74,63,47,.2);animation:pop .22s ease-out}
  .choice .btn.pick.on:active{box-shadow:0 1px 0 color-mix(in srgb, var(--cd), #000 32%), 0 2px 4px rgba(74,63,47,.12)}
  .choice .btn.pick:disabled{opacity:.55}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
  .after-lock{font-style:italic;color:var(--mutedbrown);margin:10px 0 0}

  /* Tie-breaker */
  .tb{padding:24px 18px 18px}
  .tb .tb-q{font-family:var(--display);font-size:19px;color:var(--bark);margin:0}
  .tb .tb-k{font-family:var(--label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
  .pickers{display:flex;gap:10px;margin-top:12px}
  select{flex:1;min-height:48px;font-family:var(--body);font-size:18px;color:var(--ink);background:var(--cream);border:0;padding:6px 10px;border-radius:0;box-shadow:0 4px 0 var(--ochre-deep), 0 8px 16px rgba(74,63,47,.12)}
  .tb-saved{font-style:italic;color:var(--olive-deep);margin-top:8px;min-height:22px}

  /* My answers: ten quilt blocks that fill in as codes are found */
  .progress{display:flex;gap:6px;margin:0 0 8px}
  .progress .pb{flex:1 1 0;min-width:0;aspect-ratio:1;display:grid;background:transparent;opacity:.28;transition:opacity .4s ease}
  .progress .pb.on{opacity:1}
  .progress .pb .cell{width:100%;height:100%}
  .nudge{font-style:italic;color:var(--rust);margin:0 0 14px;font-size:19px}
  .rows{list-style:none;margin:0;padding:0}
  .row{display:flex;gap:12px;align-items:flex-start;padding:22px 14px 16px;margin:0 0 14px}
  .row.hidden{padding:8px 14px;margin:0;box-shadow:none;background:transparent}
  .row.hidden:before{display:none}
  .row.hidden + .row.hidden{border-top:1px solid var(--line)}
  .row .n{flex:0 0 28px;font-family:var(--label);font-size:12px;color:var(--mutedbrown);padding-top:6px}
  .row .ic{flex:0 0 26px;width:26px;height:26px;color:var(--c);padding-top:2px}
  .row .ic svg{width:24px;height:24px;stroke-width:1.6}
  .row .ic .fb{width:20px;height:20px}
  .row .body{flex:1;min-width:0}
  .row.hidden .body{color:var(--mutedbrown);font-style:italic}
  .row.hidden .ic{opacity:.3}
  .row .body p{margin:0;font-size:19px;line-height:1.35}
  .row .body .who{font-family:var(--label);font-size:15px;letter-spacing:.06em;color:var(--cd)}
  .row .choice{margin-top:12px}
  .row .choice .btn{min-height:44px;font-size:12px}
  .row .edit{background:none;border:0;padding:6px 0 0;color:var(--mutedbrown);font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;min-height:32px}
  .row .edit:disabled{opacity:.4;cursor:default}
  .row .qb{flex:0 0 22px;width:22px;height:22px;margin-top:4px}
  .row.right .who{color:var(--olive-deep)}
  .row.wrong .who{color:var(--rust);text-decoration:line-through;text-decoration-thickness:1px}
  .row .verdict{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
  .row.right .verdict{color:var(--olive-deep)}
  .row.wrong .verdict{color:var(--rust)}
  .row.missed .verdict{color:var(--mutedbrown)}

  /* Results */
  .score{font-family:var(--display);font-size:72px;line-height:1;color:var(--rust);margin:2px 0 0}
  .score small{font-size:26px;color:var(--mutedbrown)}
  .rank-card{text-align:center;padding:26px 18px 22px}
  .rank-card .rank{font-family:var(--display);font-size:64px;line-height:1;color:var(--rust)}
  .rank-card .of{font-style:italic;color:var(--mutedbrown);font-size:19px;margin-top:4px}
  .rank-card .tbres{margin-top:10px;font-size:18px}
  .sec-k{font-family:var(--label);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mutedbrown);margin:0 0 8px;display:flex;align-items:center;gap:10px}
  .sec-k:after{content:'';flex:1;height:1px;background:var(--line)}
  .board{list-style:none;margin:0;padding:0}
  .board li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .board li:first-child{border-top:0}
  .board .pos{flex:0 0 30px;height:30px;display:grid;place-items:center;font-family:var(--label);font-size:12px;color:var(--bark);background:var(--ochre)}
  .board li.p1 .pos{background:var(--gold);color:var(--cream)}
  .board li.p2 .pos{background:var(--olive);color:var(--cream)}
  .board li.p3 .pos{background:var(--terracotta);color:var(--cream)}
  .board .nm{flex:1;font-size:19px}
  .board li.me .nm{color:var(--rust);font-weight:600}
  .board .pts{font-family:var(--display);font-size:22px;color:var(--bark)}
  .split{padding:12px 0;border-top:1px solid var(--line)}
  .split:first-of-type{border-top:0}
  .split-code{display:flex;align-items:center;gap:8px;font-family:var(--label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cd);margin:16px 0 4px}
  .split-code .qb{width:22px;height:22px}
  .split p{margin:0;font-size:18px}
  .split .bar{display:flex;height:10px;margin:8px 0 4px;background:var(--ochre);overflow:hidden}
  .split .bar i{display:block;height:100%;background:var(--olive);transition:width .6s var(--ease-out)}
  .split .bar i.wrong{background:var(--rust)}
  .split .lab{display:flex;justify-content:space-between;font-family:var(--label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mutedbrown)}
  .split .lab .ok{color:var(--olive-deep)}
  section.patch{padding-top:24px}

  /* Full-screen reveal flash */
  #ack{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;justify-content:center;padding:28px 24px;
    transform:translateY(100%);transition:transform .32s var(--ease-out)}
  #ack.show{transform:none}
  #ack .k{font-family:var(--display);font-size:22px;color:var(--bark);text-align:center;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:12px}
  #ack .k .qb{width:36px;height:36px;box-shadow:0 3px 8px rgba(74,63,47,.18)}
  .ackp{padding:24px 20px;color:var(--cream);text-align:center;margin:0 auto;width:100%;max-width:400px;box-shadow:0 14px 30px rgba(59,56,47,.2)}
  .ackp + .ackp{margin-top:14px}
  .ackp.right{background:var(--olive)}
  .ackp.wrong{background:var(--rust)}
  .ackp.missed{background:var(--mutedbrown)}
  .ackp .v{font-family:var(--display);font-size:34px;line-height:1.1}
  .ackp .s{font-size:18px;font-style:italic;margin-top:8px;opacity:.92}

  /* Mr Robin, perched on the card's foot */
  .robin{position:absolute;right:-16px;bottom:-12px;width:118px;pointer-events:none;z-index:2;transform-origin:bottom center;scale:-1 1;
    filter:drop-shadow(0 6px 7px rgba(59,56,47,.22));animation:robin-sway 4.6s ease-in-out infinite}
  @keyframes robin-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
  @media (max-width:420px){.robin{width:98px;right:-8px}}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--bark);color:var(--cream);padding:12px 18px;font-size:17px;max-width:min(92vw,400px);text-align:center;transition:opacity .2s ease,transform .2s ease;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    .sky,.glow,.robin,.card,.band .block,.alias.arrive,.panel.enter{animation:none}
    .motes{display:none}
    #ack{transition:none}
    .reel.spinning .strip{filter:none}
    ::view-transition-old(panels),::view-transition-new(panels){animation:none}
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<div class="motes" id="motes" aria-hidden="true"></div>

<main class="card" id="card">
  <div class="band" id="band" aria-hidden="true"></div>

  <header class="top">
    <div id="aliasPill" class="alias" hidden></div>
    <div id="clock" class="clock"></div>
  </header>

  <!-- Loading / error -->
  <section id="boot" class="screen" style="padding:40px 26px;text-align:center">
    <p class="note" id="bootMsg">One moment.</p>
  </section>

  <!-- Name reels -->
  <section id="spin" class="screen" hidden>
    <h1>First, a name</h1>
    <p class="lede">No real names tonight. The reels decide.</p>
    <div class="tombolas" role="group" aria-label="Name reels">
      <div class="tombola"><p class="lab">Item</p><div class="window"><div class="reel-wrap"><div class="reel" id="reelItem"><div class="strip"></div></div></div></div></div>
      <div class="tombola"><p class="lab">Role</p><div class="window"><div class="reel-wrap"><div class="reel" id="reelRole"><div class="strip"></div></div></div></div></div>
    </div>
    <div class="reel-hint" id="reelHint"></div>
    <div class="spin-actions">
      <button class="btn wide" id="btnLock" disabled>Lock it in</button>
      <button class="btn ghost wide" id="btnSpin" disabled>Spin again · 2 left</button>
    </div>
    <div class="taken" id="taken" aria-live="polite"></div>
  </section>

  <!-- The game -->
  <section id="app" class="screen" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="code" aria-selected="true" id="tabCode">This code</button>
      <button class="tab" role="tab" data-tab="mine" aria-selected="false" id="tabMine">My answers<span class="badge" id="mineBadge" hidden></span></button>
      <button class="tab" role="tab" data-tab="results" aria-selected="false" id="tabResults">Results</button>
    </nav>
    <div class="panels">
      <div class="panel" id="p-code" role="tabpanel"></div>
      <div class="panel" id="p-mine" role="tabpanel" hidden></div>
      <div class="panel" id="p-results" role="tabpanel" hidden></div>
    </div>
  </section>

/* =====================================================================
   Quilt engine. The band is the invite's, block for block. Each code
   gets its own block shape and colour, unique across the ten, and wears
   it everywhere: heading, patch strip, icons, buttons, meter, results.
   ===================================================================== */
var CODE_STYLE = [];
(function () {
  var CREAM = '#efe6d3';
  function hst(dir, a, b) {
    switch (dir) {
      case 'tl': return 'linear-gradient(to bottom right,' + a + ' 0 50%,' + b + ' 50% 100%)';
      case 'br': return 'linear-gradient(to bottom right,' + b + ' 0 50%,' + a + ' 50% 100%)';
      case 'tr': return 'linear-gradient(to bottom left,' + a + ' 0 50%,' + b + ' 50% 100%)';
      case 'bl': return 'linear-gradient(to bottom left,' + b + ' 0 50%,' + a + ' 50% 100%)';
    }
  }
  var g = function (c, r) { return { display: 'grid', gridTemplateColumns: 'repeat(' + c + ',1fr)', gridTemplateRows: 'repeat(' + r + ',1fr)' }; };
  var SHAPES = {
    geese:     function (a) { return { wrap: g(2, 2), cells: ['tr', 'tl', 'tr', 'tl'].map(function (d) { return hst(d, a, CREAM); }) }; },
    pinwheel:  function (a) { return { wrap: g(2, 2), cells: ['tr', 'br', 'tl', 'bl'].map(function (d) { return hst(d, a, CREAM); }) }; },
    dishes:    function (a) { return { wrap: g(2, 2), cells: ['br', 'bl', 'tr', 'tl'].map(function (d) { return hst(d, a, CREAM); }) }; },
    nine:      function (a) { return { wrap: g(3, 3), cells: [a, CREAM, a, CREAM, a, CREAM, a, CREAM, a] }; },
    hourglass: function (a) { return { wrap: g(1, 1), cells: ['conic-gradient(' + a + ' 0 45deg,' + CREAM + ' 45deg 135deg,' + a + ' 135deg 225deg,' + CREAM + ' 225deg 315deg,' + a + ' 315deg)'] }; }
  };
  var COLOURS = {
    rust:       { c: '#a34a2c', d: '#7e3820' },
    olive:      { c: '#7a7c47', d: '#5e6035' },
    gold:       { c: '#c99a3f', d: '#8a6a2a' },
    terracotta: { c: '#bf6a43', d: '#8f4a2c' },
    bark:       { c: '#4a3f2f', d: '#2e2719' }
  };
  // ten unique pairings, in code order
  var PAIRS = [['geese', 'rust'], ['pinwheel', 'olive'], ['dishes', 'gold'], ['nine', 'terracotta'], ['hourglass', 'bark'],
               ['pinwheel', 'rust'], ['dishes', 'olive'], ['geese', 'gold'], ['hourglass', 'terracotta'], ['nine', 'bark']];
  PAIRS.forEach(function (pr) { CODE_STYLE.push({ shape: pr[0], c: COLOURS[pr[1]].c, d: COLOURS[pr[1]].d }); });

  function blockHtml(shape, colour, px, cls) {
    var b = SHAPES[shape](colour), style = 'display:' + b.wrap.display + ';grid-template-columns:' + b.wrap.gridTemplateColumns + ';grid-template-rows:' + b.wrap.gridTemplateRows + (px ? ';width:' + px + 'px;height:' + px + 'px' : '');
    return '<span class="' + (cls || 'qb') + '" style="' + style + '" aria-hidden="true">' + b.cells.map(function (bg) { return '<span class="cell" style="background:' + bg + '"></span>'; }).join('') + '</span>';
  }
  window.codeBlock = function (i, px, cls) { var st = CODE_STYLE[i]; return blockHtml(st.shape, st.c, px, cls); };
  window.codeVars = function (i) { var st = CODE_STYLE[i]; return '--c:' + st.c + ';--cd:' + st.d; };

  // the band: the invite's sequence, block for block
  var BAND = [['pinwheel', '#7a7c47'], ['dishes', '#c99a3f'], ['nine', '#bf6a43'], ['hourglass', '#4a3f2f'], ['geese', '#a34a2c'], ['pinwheel', '#7a7c47'], ['dishes', '#c99a3f']];
  var band = $('band');
  band.innerHTML = BAND.map(function (b, i) { return blockHtml(b[0], b[1], 44, 'block'); }).join('');
  Array.prototype.forEach.call(band.children, function (blk, i) { blk.style.animationDelay = (0.35 + i * 0.09) + 's'; });

  // dust motes drifting up through the light, as on the invite
  if (!REDUCED) {
    var motes = $('motes');
    for (var m = 0; m < 14; m++) {
      var d = document.createElement('div'); d.className = 'mote';
      var sz = 2 + Math.random() * 4;
      d.style.width = d.style.height = sz + 'px';
      d.style.left = Math.random() * 100 + '%';
      d.style.setProperty('--o', (0.25 + Math.random() * 0.4).toFixed(2));
      d.style.animationDuration = (16 + Math.random() * 18) + 's';
      d.style.animationDelay = (-Math.random() * 30) + 's';
      motes.appendChild(d);
    }
  }
})();

/* =====================================================================
   Icons: fetched once and inlined so they take the theme colour.
   Fallback is a small quilt block, so nothing ever ships broken.
   ===================================================================== */
function iconUrl(file) { return /^https?:/.test(file) ? file : (content.iconBase || '') + file; }
function iconFallback() {
  return '<span class="fb" style="display:block;background:conic-gradient(currentColor 0 45deg,#efe6d3 45deg 135deg,currentColor 135deg 225deg,#efe6d3 225deg 315deg,currentColor 315deg)"></span>';
}
function icon(file) {
  var url = iconUrl(file);
  if (iconCache[url] === undefined) {
    iconCache[url] = null;
    fetch(url).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (svg) {
      if (svg.indexOf('<svg') < 0) throw 0;
      iconCache[url] = svg.replace(/<\?xml[^>]*>/, '').replace(/<svg /, '<svg aria-hidden="true" ');
      document.querySelectorAll('[data-icon="' + url + '"]').forEach(function (el) { el.innerHTML = iconCache[url]; });
    }).catch(function () { iconCache[url] = false; });
  }
  var inner = iconCache[url] ? iconCache[url] : iconFallback();
  return '<span class="ic-slot" data-icon="' + esc(url) + '">' + inner + '</span>';
}

/* =====================================================================
   Content and Firebase boot
   ===================================================================== */
function qnum(k) { return parseInt(String(k).replace('q', ''), 10); }
function question(k) { return content.questions[qnum(k) - 1]; }
function allKeys() { var a = []; for (var i = 1; i <= TOTAL_CODES; i++) a.push('q' + i); return a; }
function statementText(k, side, person) {
  var q = question(k)[side];
  if (person) return q.third.replace('{name}', '<span class="who">' + esc(NAMES[person].toUpperCase()) + '</span>');
  return q.first;
}
function isFound(k) { return !!(config.releasedAt || (me && me.found && me.found[k])); }
function pick(k, side) { return me && me.answers && me.answers[k] ? me.answers[k][side] || null : null; }
function foundCount() { var n = 0; allKeys().forEach(function (k) { if (me && me.found && me.found[k]) n++; }); return n; }
function answeredCount(p) { var n = 0; allKeys().forEach(function (k) { if (p && p.answers && p.answers[k]) { if (p.answers[k].human) n++; if (p.answers[k].dog) n++; } }); return n; }
function revealedKeys() { return allKeys().filter(function (k) { return config.revealed && config.revealed[k] === true; }); }

fetch('content.json', { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('content'); return r.json(); })
  .then(function (c) { content = c; return startFirebase(); })
  .catch(function (e) { $('bootMsg').textContent = 'Could not load the game. Check your signal and try again.'; console.error(e); });

function startFirebase() {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  auth = firebase.auth();
  db.ref('.info/serverTimeOffset').on('value', function (s) { offset = s.val() || 0; });
  return auth.signInAnonymously().then(function (cred) {
    uid = cred.user.uid;
    return resolveCode();
  }).then(function () {
    try { alias = localStorage.getItem(ALIAS_KEY); } catch (e) { alias = null; }
    if (alias) enterGame(); else showSpin();
  }).catch(function (e) {
    $('bootMsg').textContent = 'Could not connect. Check your signal and try again.'; console.error(e);
  });
}

function resolveCode() {
  var m = location.search.match(/[?&]c=([a-z0-9]+)/i);
  if (!m) return Promise.resolve();
  code = m[1].toLowerCase();
  return db.ref(ROOT + '/codes/' + code).once('value').then(function (s) {
    var v = s.val();
    if (v && /^q([1-9]|10)$/.test(v)) qk = v; else codeUnknown = true;
  }).catch(function () { codeUnknown = true; });
}

/* =====================================================================
   The tombola
   ===================================================================== */
var LINE = 52, REPEAT = 7;
var reels = {};
function buildReel(id, words) {
  var el = $(id), strip = el.querySelector('.strip');
  var html = '';
  for (var r = 0; r < REPEAT; r++) words.forEach(function (w) { html += '<div class="word">' + esc(w) + '</div>'; });
  strip.innerHTML = html;
  var st = { el: el, strip: strip, words: words, pos: words.length * 3, anim: null };
  strip.style.transform = 'translateY(' + (-(st.pos - 1) * LINE) + 'px)';
  reels[id] = st;
  return st;
}
function markHit(st) {
  var all = st.strip.children;
  for (var i = 0; i < all.length; i++) all[i].classList.toggle('hit', i === st.pos);
}
function spinReel(st, target, duration, delay, dir) {
  var n = st.words.length;
  return new Promise(function (done) {
    for (var i = 0; i < st.strip.children.length; i++) st.strip.children[i].classList.remove('hit');
    // keep the strip index bounded: same visible word, middle copy, so either direction has room
    var base = (st.pos % n) + 3 * n;
    var to;
    if (dir < 0) { to = base - 2 * n - (((base - target) % n) + n) % n; }
    else { to = base + 2 * n + (((target - base) % n) + n) % n; }
    var y = function (p) { return 'translateY(' + (-(p - 1) * LINE) + 'px)'; };
    st.strip.style.transform = y(base);
    st.pos = to;
    if (REDUCED) { st.strip.style.transform = y(to); markHit(st); done(); return; }
    st.el.classList.add('spinning');
    setTimeout(function () {
      var a = st.strip.animate([
        { transform: y(base), easing: 'cubic-bezier(.12,.62,.22,1)' },
        { transform: y(to + 0.32 * (dir < 0 ? -1 : 1)), offset: 0.84, easing: 'cubic-bezier(.3,0,.5,1)' },
        { transform: y(to) }
      ], { duration: duration, fill: 'forwards' });
      a.onfinish = function () {
        st.strip.style.transform = y(to);
        try { a.cancel(); } catch (e) {}
        st.el.classList.remove('spinning');
        markHit(st);
        done();
      };
    }, delay || 0);
  });
}
var spinsLeft = RESPINS, spinning = false, current = null;
function spin(free) {
  if (spinning) return;
  spinning = true;
  var items = content.reels.items, roles = content.reels.roles;
  var ti = Math.floor(Math.random() * items.length), tr = Math.floor(Math.random() * roles.length);
  current = { item: items[ti], role: roles[tr] };
  $('btnLock').disabled = true; $('btnSpin').disabled = true;
  $('reelHint').textContent = 'Spinning…';
  if (!free) $('taken').textContent = '';
  Promise.all([
    spinReel(reels.reelItem, ti, 1500, 0, 1),
    spinReel(reels.reelRole, tr, 2150, 140, -1)
  ]).then(function () {
    spinning = false;
    $('reelHint').textContent = prettyAlias(slugOf(current.item, current.role));
    $('btnLock').disabled = false;
    $('btnSpin').disabled = spinsLeft <= 0;
    $('btnSpin').textContent = spinsLeft > 0 ? 'Spin again · ' + spinsLeft + ' left' : 'No spins left';
  });
}
function showSpin() {
  $('boot').hidden = true;
  $('spin').hidden = false;
  buildReel('reelItem', content.reels.items);
  buildReel('reelRole', content.reels.roles);
  setTimeout(function () { spin(false); }, 350);
  $('btnSpin').addEventListener('click', function () { if (spinsLeft > 0) { spinsLeft--; spin(false); } });
  $('btnLock').addEventListener('click', lockIn);
}
function lockIn() {
  if (spinning || !current) return;
  var slug = slugOf(current.item, current.role);
  $('btnLock').disabled = true; $('btnSpin').disabled = true;
  db.ref(ROOT + '/players/' + slug).transaction(function (cur) {
    if (cur === null) return { uid: uid, claimedAt: now(), lastChange: now() };
    return; // taken: abort
  }).then(function (res) {
    if (!res.committed) {
      $('taken').textContent = 'Someone’s already ' + prettyAlias(slug).replace(/^The/, 'the') + '. Have another go.';
      setTimeout(function () { spin(true); }, 900);
      return;
    }
    alias = slug;
    try { localStorage.setItem(ALIAS_KEY, alias); } catch (e) {}
    $('spin').classList.add('lockin');
    setTimeout(enterGame, REDUCED ? 0 : 380);
  }).catch(function (e) {
    console.error(e);
    $('taken').textContent = 'That didn’t save. Check your signal and try again.';
    $('btnLock').disabled = false;
  });
}

/* =====================================================================
   The game proper
   ===================================================================== */
function enterGame() {
  $('boot').hidden = true; $('spin').hidden = true; $('app').hidden = false;
  var pill = $('aliasPill'); pill.textContent = prettyAlias(alias); pill.hidden = false; pill.classList.add('arrive');
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });

  db.ref(ROOT + '/config').on('value', function (s) { config = s.val() || {}; onConfig(); });
  db.ref(ROOT + '/players').on('value', function (s) { players = s.val() || {}; me = players[alias] || null; onPlayer(); });

  if (qk) recordFound();
  if (!qk) { tab = 'mine'; }
  setTabUI();
  renderAll();
  setInterval(tickClock, 500);
}
var healing = false;
function onPlayer() {
  // After a host reset the alias node is gone: quietly re-claim it so the phone keeps working.
  if (me === null && !healing) {
    healing = true;
    db.ref(ROOT + '/players/' + alias).transaction(function (cur) { return cur === null ? { uid: uid, claimedAt: now(), lastChange: now() } : undefined; })
      .then(function () { healing = false; if (qk) recordFound(); }).catch(function () { healing = false; });
  }
  renderAll();
}
function recordFound() {
  if (!qk || !alias) return;
  if (me && me.found && me.found[qk]) return;
  var up = {}; up['found/' + qk] = { code: code, at: TS }; up.lastChange = TS;
  db.ref(ROOT + '/players/' + alias).update(up).catch(function (e) { console.warn('found', e && e.code); });
}
function onConfig() {
  var keys = revealedKeys();
  if (seenRevealed === null) { seenRevealed = {}; keys.forEach(function (k) { seenRevealed[k] = true; }); loadAnswers(keys, null); }
  else {
    var fresh = keys.filter(function (k) { return !seenRevealed[k]; });
    keys.forEach(function (k) { seenRevealed[k] = true; });
    if (fresh.length) loadAnswers(keys, fresh);
    if (!keys.length) { answers = {}; }
  }
  tickClock();
  renderAll();
}
function loadAnswers(keys, fresh) {
  var want = keys.filter(function (k) { return !answers[k]; });
  if (keys.length === TOTAL_CODES && !answers.tiebreak) want.push('tiebreak');
  Promise.all(want.map(function (k) { return db.ref(ROOT + '/answers/' + k).once('value').then(function (s) { if (s.val()) answers[k] = s.val(); }); }))
    .then(function () {
      renderAll();
      if (fresh && fresh.length === 1) queueAck(fresh[0]);
      else if (fresh && fresh.length > 1) { showTab('results'); }
    }).catch(function (e) { console.warn('answers', e && e.code); });
}

/* ---- Countdown ---- */
function tickClock() {
  var el = $('clock');
  if (!config.lockAt) { locked = false; el.textContent = ''; el.className = 'clock'; return; }
  var rem = config.lockAt - now();
  if (rem <= 0) {
    if (!locked) { locked = true; renderAll(); }
    el.textContent = 'Locked. Answers at the pub.'; el.className = 'clock locked'; return;
  }
  locked = false;
  var s = Math.ceil(rem / 1000), m = Math.floor(s / 60);
  el.textContent = 'Locks in ' + m + ':' + ('0' + (s % 60)).slice(-2);
  el.className = 'clock' + (rem < 120000 ? ' soon' : '');
}

/* ---- Tabs ---- */
function setTabUI() {
  document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'); });
  ['code', 'mine', 'results'].forEach(function (t) { $('p-' + t).hidden = t !== tab; });
}
function showTab(t) {
  if (t === tab) return;
  var go = function () { tab = t; setTabUI(); };
  if (document.startViewTransition && !REDUCED) { document.startViewTransition(go); }
  else { go(); var p = $('p-' + t); p.classList.remove('enter'); void p.offsetWidth; p.classList.add('enter'); }
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ---- Writes ---- */
function saveAnswer(k, side, val) {
  if (locked) { toast('Too late. Answers at the pub.'); return; }
  var up = {}; up['answers/' + k + '/' + side] = val; up['answers/' + k + '/at'] = TS; up.lastChange = TS;
  db.ref(ROOT + '/players/' + alias).update(up).catch(function (e) {
    if (e && e.code === 'PERMISSION_DENIED') { locked = true; toast('Too late. Answers at the pub.'); renderAll(); }
    else toast('That didn’t save. Check your signal.');
  });
}
function saveTiebreak(day, month) {
  if (locked) { toast('Too late. Answers at the pub.'); return; }
  db.ref(ROOT + '/players/' + alias).update({ tiebreak: { day: day, month: month, at: TS }, lastChange: TS }).catch(function (e) {
    if (e && e.code === 'PERMISSION_DENIED') { locked = true; toast('Too late. Answers at the pub.'); renderAll(); }
    else toast('That didn’t save. Check your signal.');
  });
}
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-pick]');
  if (b) {
    var k = b.dataset.q, side = b.dataset.side, val = b.dataset.pick;
    if (b.classList.contains('on')) return;
    // fill instantly, then commit
    var group = b.parentNode.querySelectorAll('.pick');
    group.forEach(function (x) { x.classList.toggle('on', x === b); });
    saveAnswer(k, side, val);
    return;
  }
  var e = ev.target.closest('[data-flip]');
  if (e) {
    var k2 = e.dataset.q, side2 = e.dataset.side, cur = pick(k2, side2);
    var flip = side2 === 'human' ? (cur === 'R' ? 'L' : 'R') : (cur === 'E' ? 'T' : 'E');
    saveAnswer(k2, side2, flip);
  }
});
document.addEventListener('change', function (ev) {
  if (!ev.target.matches('.tb select')) return;
  var box = ev.target.closest('.tb');
  var d = parseInt(box.querySelector('.tb-day').value, 10), m = parseInt(box.querySelector('.tb-month').value, 10);
  if (d && m) saveTiebreak(d, m);
});

/* =====================================================================
   Rendering
   ===================================================================== */
function renderAll() { if (!content || !$('app') || $('app').hidden) return; renderCode(); renderMine(); renderResults(); }

function choiceHtml(k, side, disabled) {
  var cur = pick(k, side);
  var opts = side === 'human' ? ['R', 'L'] : ['E', 'T'];
  return '<div class="choice">' + opts.map(function (o) {
    return '<button class="btn pick' + (cur === o ? ' on' : '') + '" data-pick="' + o + '" data-q="' + k + '" data-side="' + side + '"' + (disabled ? ' disabled' : '') + '>' + NAMES[o] + '</button>';
  }).join('') + '</div>';
}
function stmtHtml(k, side) {
  var q = question(k)[side];
  return '<div class="patch stmt ' + side + '" style="' + window.codeVars(qnum(k) - 1) + '"><div class="stmt-row ' + side + '"><span class="icon">' + icon(q.icon) + '</span><p class="stmt-text">' + esc(q.first) + '</p></div>' +
    (locked ? '<p class="after-lock">' + (pick(k, side) ? 'You said ' + NAMES[pick(k, side)] + '.' : 'Not answered.') + '</p>' : choiceHtml(k, side, false)) + '</div>';
}
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function tiebreakHtml(compact) {
  var tb = me && me.tiebreak;
  var dayOpts = '<option value="">Day</option>'; for (var d = 1; d <= 31; d++) dayOpts += '<option value="' + d + '"' + (tb && tb.day === d ? ' selected' : '') + '>' + d + '</option>';
  var monOpts = '<option value="">Month</option>'; MONTHS.forEach(function (m, i) { monOpts += '<option value="' + (i + 1) + '"' + (tb && tb.month === i + 1 ? ' selected' : '') + '>' + m + '</option>'; });
  if (locked) {
    return '<p class="after-lock">' + (tb ? 'You said ' + tb.day + ' ' + MONTHS[tb.month - 1] + ' ' + TB_YEAR + '.' : 'Not answered.') + '</p>';
  }
  return '<div class="pickers"><select class="tb-day" aria-label="Day">' + dayOpts + '</select><select class="tb-month" aria-label="Month">' + monOpts + '</select></div>' +
    '<div class="tb-saved">' + (tb ? 'Saved: ' + tb.day + ' ' + MONTHS[tb.month - 1] + ' ' + TB_YEAR + '. Change it any time.' : (compact ? '' : 'Closest wins any tie.')) + '</div>';
}

function codeHead(title, n) {
  if (!n) return '<div class="ph"><h2>' + title + '</h2></div>';
  return '<div class="ph" style="' + window.codeVars(n - 1) + '"><span class="num" aria-hidden="true">' + n + '</span>' + window.codeBlock(n - 1, 40) + '<h2>' + title + '</h2><small>of ' + TOTAL_CODES + '</small></div>';
}
function renderCode() {
  var p = $('p-code'), html = '';
  if (codeUnknown) {
    html = codeHead('Not one of ours') + '<p class="note">Try the scan again, or find another.</p>';
  } else if (!qk) {
    html = codeHead('Scan a code') + '<p class="note">Ten are hidden around the venue. Each one opens here.</p>';
  } else if (locked) {
    html = codeHead('Code ' + qnum(qk), qnum(qk)) + '<p class="note">Locked. Answers at the pub.</p>';
  } else {
    html = codeHead('Code ' + qnum(qk), qnum(qk));
    if (config.releasedAt) html += '<p class="note">Everything\u2019s open. Answer what you can.</p>';
    html += stmtHtml(qk, 'human') + stmtHtml(qk, 'dog');
    if (!(me && me.tiebreak)) {
      html += '<div class="patch gold tb"><p class="tb-k">Tie-breaker</p><p class="tb-q">' + esc(content.tiebreak.question) + '</p>' + tiebreakHtml(false) + '</div>';
    }
  }
  p.innerHTML = html;
}

function renderMine() {
  var p = $('p-mine');
  var found = foundCount(), left = TOTAL_CODES - found;
  var head;
  if (config.releasedAt) head = 'Everything’s open. Answer what you can.';
  else if (left === 0) head = 'All found. Answers at the pub.';
  else head = left + ' more code' + (left === 1 ? '' : 's') + ' to find';
  var pending = 0;
  allKeys().forEach(function (k) { if (isFound(k)) { if (!pick(k, 'human')) pending++; if (!pick(k, 'dog')) pending++; } });
  var html = '<div class="progress" aria-label="' + found + ' of ' + TOTAL_CODES + ' codes found">';
  allKeys().forEach(function (k, i) { html += window.codeBlock(i, 0, 'pb' + (isFound(k) ? ' on' : '')); });
  html += '</div>';
  html += '<div class="ph"><h2>' + head + '</h2></div>';
  if (pending && !locked) html += '<p class="nudge">' + pending + ' still to answer.</p>';
  if (locked) html += '<p class="note">Locked. Nothing changes now.</p>';
  html += '<ol class="rows">';
  var revealed = config.revealed || {};
  allKeys().forEach(function (k) {
    ['human', 'dog'].forEach(function (side) {
      var q = question(k)[side], n = qnum(k);
      var label = n + (side === 'human' ? 'a' : 'b');
      if (!isFound(k)) {
        html += '<li class="row hidden ' + side + '" style="' + window.codeVars(n - 1) + '"><span class="n">' + label + '</span>' + window.codeBlock(n - 1, 22) + '<div class="body"><p>Not found yet</p></div></li>';
        return;
      }
      var cur = pick(k, side);
      var cls = 'row patch ' + side, verdict = '';
      if (revealed[k] && answers[k]) {
        var truth = answers[k][side];
        if (!cur) { cls += ' missed'; verdict = 'Not answered. It was ' + NAMES[truth] + '.'; }
        else if (cur === truth) { cls += ' right'; verdict = 'Right'; }
        else { cls += ' wrong'; verdict = 'Wrong. It was ' + NAMES[truth] + '.'; }
      }
      html += '<li class="' + cls + '" style="' + window.codeVars(n - 1) + '"><span class="n">' + label + '</span><span class="ic">' + icon(q.icon) + '</span><div class="body">';
      if (cur) {
        html += '<p>' + statementText(k, side, cur) + '</p>';
        if (verdict) html += '<div class="verdict">' + esc(verdict) + '</div>';
        else html += '<button class="edit" data-flip="1" data-q="' + k + '" data-side="' + side + '"' + (locked ? ' disabled' : '') + '>Swap to ' + NAMES[side === 'human' ? (cur === 'R' ? 'L' : 'R') : (cur === 'E' ? 'T' : 'E')] + '</button>';
      } else {
        html += '<p>' + esc(q.first) + '</p>';
        if (verdict) html += '<div class="verdict">' + esc(verdict) + '</div>';
        else if (locked) html += '<div class="verdict">Not answered</div>';
        else html += choiceHtml(k, side, false);
      }
      html += '</div></li>';
    });
  });
  if (me) {
    html += '<li class="row patch gold"><span class="n">21</span><span class="ic">' + iconFallback() + '</span><div class="body tb" style="border:0;padding:0;margin:0"><p>' + esc(content.tiebreak.third) + '</p>' + tiebreakHtml(true) + '</div></li>';
  }
  html += '</ol>';
  p.innerHTML = html;
  $('mineBadge').hidden = !(pending && !locked);
}

/* ---- Scoring ---- */
function scoreOf(p, keys) {
  var s = 0;
  keys.forEach(function (k) {
    var a = answers[k]; if (!a || !p || !p.answers || !p.answers[k]) return;
    if (p.answers[k].human && p.answers[k].human === a.human) s++;
    if (p.answers[k].dog && p.answers[k].dog === a.dog) s++;
  });
  return s;
}
function tbDistance(p) {
  if (!p || !p.tiebreak || !answers.tiebreak) return null;
  var a = Date.UTC(TB_YEAR, answers.tiebreak.month - 1, answers.tiebreak.day), b = Date.UTC(TB_YEAR, p.tiebreak.month - 1, p.tiebreak.day);
  return Math.abs(Math.round((a - b) / 86400000));
}
function standings(keys) {
  var list = Object.keys(players).map(function (slug) {
    var d = tbDistance(players[slug]);
    return { slug: slug, score: scoreOf(players[slug], keys), tb: d === null ? Infinity : d };
  });
  list.sort(function (a, b) { return b.score - a.score || a.tb - b.tb || (a.slug < b.slug ? -1 : 1); });
  var pos = 0;
  list.forEach(function (r, i) {
    if (i === 0 || r.score !== list[i - 1].score || r.tb !== list[i - 1].tb) pos = i + 1;
    r.pos = pos;
    r.shared = list.some(function (o, j) { return j !== i && o.score === r.score && o.tb === r.tb; });
  });
  return list;
}
function ordinal(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function renderResults() {
  var p = $('p-results');
  var keys = revealedKeys().filter(function (k) { return answers[k]; });
  if (!keys.length) {
    p.innerHTML = codeHead('Results at the pub') +
      '<p class="note">' + foundCount() + ' of ' + TOTAL_CODES + ' found · ' + answeredCount(me) + ' of ' + (TOTAL_CODES * 2) + ' answered</p>';
    lastScore = 0;
    return;
  }
  var table = standings(keys);
  var mine = table.filter(function (r) { return r.slug === alias; })[0];
  var myScore = mine ? mine.score : 0;
  var done = keys.length === TOTAL_CODES;
  var html = '<div class="ph"><h2>Results</h2><small>' + keys.length + ' of ' + TOTAL_CODES + ' revealed</small></div>';
  if (done && mine) {
    html += '<div class="patch gold rank-card"><div class="rank">' + (mine.shared ? '=' : '') + ordinal(mine.pos) + '</div><div class="of">of ' + table.length + '</div>';
    var d = tbDistance(me);
    if (answers.tiebreak) {
      html += '<div class="tbres">The date was ' + answers.tiebreak.day + ' ' + MONTHS[answers.tiebreak.month - 1] + ' ' + TB_YEAR + '. ' +
        (d === null ? 'You didn’t answer the tie-breaker.' : (d === 0 ? 'Spot on.' : 'You were ' + d + ' day' + (d === 1 ? '' : 's') + ' out.')) + '</div>';
    }
    html += '</div>';
  }
  html += '<section class="patch"><p class="sec-k">Your score</p><div class="score"><span id="scoreNum">' + lastScore + '</span> <small>/ ' + (TOTAL_CODES * 2) + '</small></div></section>';
  html += '<section class="patch"><p class="sec-k">Leaderboard</p><ol class="board">';
  table.forEach(function (r) {
    html += '<li class="' + (r.slug === alias ? 'me ' : '') + (r.pos <= 3 ? 'p' + r.pos : '') + '"><span class="pos">' + (r.shared ? '=' : '') + r.pos + '</span><span class="nm">' + esc(prettyAlias(r.slug)) + '</span><span class="pts">' + r.score + '</span></li>';
  });
  html += '</ol></section>';
  html += '<section class="patch"><p class="sec-k">The room</p>';
  var total = Object.keys(players).length;
  keys.slice().reverse().forEach(function (k) {
    html += '<div class="split-code" style="' + window.codeVars(qnum(k) - 1) + '">' + window.codeBlock(qnum(k) - 1, 22) + 'Code ' + qnum(k) + '</div>';
    ['human', 'dog'].forEach(function (side) {
      var truth = answers[k][side];
      var opts = side === 'human' ? ['R', 'L'] : ['E', 'T'];
      var counts = {}; opts.forEach(function (o) { counts[o] = 0; });
      Object.keys(players).forEach(function (s) { var pl = players[s]; var a = pl.answers && pl.answers[k] && pl.answers[k][side]; if (a && counts[a] !== undefined) counts[a]++; });
      var wrongName = opts.filter(function (o) { return o !== truth; })[0];
      var majority = counts[truth] >= counts[wrongName] ? truth : wrongName;
      var line = (counts[truth] + counts[wrongName]) === 0 ? 'Nobody answered this one. It was ' + NAMES[truth] + '.' : counts[majority] + ' of ' + total + ' said ' + NAMES[majority] + '. ' + (majority === truth ? 'Right.' : 'Wrong. It was ' + NAMES[truth] + '.');
      var pctR = total ? Math.round(counts[truth] / total * 100) : 0, pctW = total ? Math.round(counts[wrongName] / total * 100) : 0;
      html += '<div class="split"><p>' + esc(question(k)[side].third.replace('{name}', NAMES[truth])) + '</p>' +
        '<div class="bar"><i style="width:' + pctR + '%"></i><i class="wrong" style="width:' + pctW + '%"></i></div>' +
        '<div class="lab"><span class="ok">' + NAMES[truth] + ' ' + counts[truth] + '</span><span>' + NAMES[wrongName] + ' ' + counts[wrongName] + '</span></div>' +
        '<p class="note" style="margin:6px 0 0">' + esc(line) + '</p></div>';
    });
  });
  html += '</section>';
  p.innerHTML = html;
  tickScore(lastScore, myScore);
  lastScore = myScore;
}
function tickScore(from, to) {
  var el = $('scoreNum'); if (!el) return;
  if (REDUCED || from === to) { el.textContent = to; return; }
  var t0 = performance.now(), dur = 700;
  (function step(t) {
    var k = Math.min(1, (t - t0) / dur); k = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * k);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---- The reveal flash ---- */
function queueAck(k) { ackQueue.push(k); runAck(); }
function runAck() {
  if (ackBusy || !ackQueue.length) return;
  ackBusy = true;
  var k = ackQueue.shift(), a = answers[k];
  if (!a) { ackBusy = false; runAck(); return; }
  var panels = ['human', 'dog'].map(function (side) {
    var truth = a[side], cur = pick(k, side);
    var cls = !cur ? 'missed' : (cur === truth ? 'right' : 'wrong');
    var v = cls === 'right' ? 'Right' : (cls === 'wrong' ? 'Wrong. It was ' + NAMES[truth] : 'Not answered. It was ' + NAMES[truth]);
    return '<div class="ackp ' + cls + '"><div class="v">' + esc(v) + '</div><div class="s">' + esc(question(k)[side].third.replace('{name}', NAMES[truth])) + '</div></div>';
  }).join('');
  var el = $('ack');
  el.innerHTML = '<div class="k">' + window.codeBlock(qnum(k) - 1, 36) + 'Code ' + qnum(k) + '</div>' + panels;
  void el.offsetWidth;
  el.classList.add('show');
  try { if (navigator.vibrate) navigator.vibrate([70, 50, 70]); } catch (e) {}
  setTimeout(function () {
    el.classList.remove('show');
    showTab('results');
    setTimeout(function () { ackBusy = false; runAck(); }, 380);
  }, 2200);
}
</script>
